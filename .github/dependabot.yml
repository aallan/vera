# Dependabot — automated dependency update PRs.
# See https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Python dependencies — managed via uv.
  # The "uv" ecosystem updates pyproject.toml AND regenerates uv.lock
  # in the same PR so the lockfile stays in sync with manifest bumps.
  # Using "pip" leaves uv.lock stale and breaks the `uv lock --check`
  # step in CI lint (see PR #493 for the failure mode).
  # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # One PR per week for every Python bump, so the lockfile is rebased
    # once rather than once per package under strict branch protection.
    groups:
      python:
        patterns: ["*"]

  # VS Code extension dependencies (npm).
  # Without this entry the extension's tree was only ever updated when
  # GitHub raised a security alert — security updates fire off the
  # advisory database regardless of what is configured here, version
  # updates do not.  That is how a `vscode-languageclient` major bump
  # first arrived bundled into a CVE fix (PR #1127) rather than as a
  # routine bump months earlier.
  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      extension:
        patterns: ["*"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
