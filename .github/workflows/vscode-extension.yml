name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Scoped to production dependencies: those are what esbuild
      # bundles into the VSIX and ships to users.  An advisory against
      # a build-only package (vsce's own tree, say) is worth knowing
      # about but must not block an unrelated PR, since the fix is
      # rarely ours to make.  Verified load-bearing against the lockfile
      # as it stood before #1129: this gate fails on that tree, where
      # `brace-expansion` was a runtime transitive of the language
      # client.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check extension source
        run: npm run check

      - name: Test extension scripts
        run: npm test

      - name: Inspect packaged files
        run: npm run package:list

      - name: Build VSIX
        run: npm run package

      # After packaging: the check reads the built .vsix, since vsce
      # synthesises entries and re-runs the build during packaging.
      - name: Check packaged contents
        run: npm run check:package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vera-language-vsix-${{ github.sha }}
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 30
