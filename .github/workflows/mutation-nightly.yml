name: Mutation (nightly)

# The nightly mutation sweep (MUTATION.md § The measure-all baseline):
# mutmut over every function in vera/, a slice a night, so the whole tree is
# measured over a cycle of nights and no run is a marathon.
# `scripts/mutate_sweep.py` plans each night from the state the last night
# left, and each of the night's jobs runs its slice of that plan; the stitch
# job folds the slices into the state, kept as the `mutation-sweep-state`
# artifact for 90 days.  When a cycle closes, the artifact holds the
# `mutation-summary.csv` and `mutation.json` a pull request commits (the
# README badge reads `mutation.json` on main).
#
# A night that decides nothing, or whose engine or lane fails, ends red, and
# on the schedule the `issue` job files or updates one tracking issue (the
# `mutation-sweep` label), as nightly-stress.yml does.  Survivors are the
# measurement, never a failure.  The sweep jobs read the repository and the
# last night's artifact and write nothing back; only the `issue` job can
# write, and only issues.  Every context value reaches a shell through `env`.

on:
  schedule:
    # 21:00 UTC, clear of ci.yml's nightly run and nightly-stress.yml's.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "The night's jobs (each plans the same night and runs its slice)"
        type: number
        default: 1

permissions:
  contents: read

# One night at a time, and a night is never cancelled: the next one plans
# from the state this one leaves.
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  setup:
    permissions:
      contents: read
      # Find the last night's state artifact.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
      slices: ${{ steps.jobs.outputs.slices }}
      state-run: ${{ steps.state.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The schedule runs mutate_sweep.JOBS jobs; a dispatch runs the number
      # it is given, one by default.
      - id: jobs
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.jobs }}
        run: python3 scripts/mutate_sweep.py matrix --event "$EVENT" --requested "$REQUESTED" >> "$GITHUB_OUTPUT"

      # The newest unexpired state artifact a run on main uploaded; none
      # before the first night.
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: >-
          echo "run=$(gh api --paginate "repos/$REPO/actions/artifacts?name=mutation-sweep-state&per_page=100"
          --jq '.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")
          | "\(.created_at) \(.workflow_run.id)"' | sort | tail -n 1 | cut -d " " -f 2)"
          >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    permissions:
      contents: read
      # Download the last night's state artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.setup.outputs.slices) }}
    runs-on: ubuntu-latest
    # The script's budget (--budget, 4.5 h) plus installing the extra, the
    # sweep's own tests, the scratch tree and the engine's grace on a stop,
    # inside a hosted job's 6 h.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[mutation]"

      - name: Test the sweep against the engine it installs
        run: pytest tests/test_mutate_sweep.py tests/test_mutate_diff.py -q

      - name: Download the last night's state
        if: needs.setup.outputs.state-run != ''
        uses: actions/download-artifact@v8
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-in
          run-id: ${{ needs.setup.outputs.state-run }}
          github-token: ${{ github.token }}

      - name: Mutate this slice of the night
        env:
          SLICE: ${{ matrix.slice }}
          JOBS: ${{ needs.setup.outputs.jobs }}
        run: >-
          python scripts/mutate_sweep.py night
          --slice "$SLICE" --of "$JOBS"
          --state "$RUNNER_TEMP/state-in"
          --budget 16200
          --workdir "$RUNNER_TEMP/sweep"
          --out "$RUNNER_TEMP/slice"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the slice's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/slice/
          retention-days: 7

  stitch:
    needs: [setup, sweep]
    if: always() && needs.setup.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the last night's state
        if: needs.setup.outputs.state-run != ''
        uses: actions/download-artifact@v8
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-in
          run-id: ${{ needs.setup.outputs.state-run }}
          github-token: ${{ github.token }}

      - name: Download the slices' records
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-sweep-slice-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true

      - name: Fold the night into the state
        env:
          JOBS: ${{ needs.setup.outputs.jobs }}
        run: >-
          python scripts/mutate_sweep.py stitch
          --state "$RUNNER_TEMP/state-in"
          --slices "$RUNNER_TEMP/slices"
          --of "$JOBS"
          --out "$RUNNER_TEMP/state-out"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-out/
          retention-days: 90

  # A tracking issue when a scheduled night stops short; a dispatched run is
  # watched by whoever started it.
  issue:
    needs: [setup, sweep, stitch]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const LABEL = "mutation-sweep";
            const TITLE = "Nightly mutation sweep stopped short on main (tracking)";
            const sha = process.env.COMMIT_SHA;
            const body = [
              `The nightly mutation sweep stopped short against \`${sha.slice(0, 7)}\` (commit ${sha}): a night that decided no mutant, or a slice whose engine or lane failed.`,
              ``,
              `**Run**: ${process.env.RUN_URL}`,
              ``,
              `The stitch job's summary names what stopped it; each slice's record is its \`mutation-sweep-slice-<n>\` artifact.  Survivors never file this issue.  MUTATION.md § The measure-all baseline has the sweep's rules.`,
            ].join("\n");
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
                color: "d73a4a", description: "The nightly mutation sweep stopped short on main",
              });
            }
            // Issues only: listForRepo also returns pull requests.
            const { data: candidates } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: "open", per_page: 10,
            });
            const open = candidates.filter(item => !item.pull_request);
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
              core.info(`Commented on #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL],
              });
              core.info(`Filed #${created.number}`);
            }
