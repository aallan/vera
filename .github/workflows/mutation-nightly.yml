name: Mutation (nightly)

# The nightly mutation sweep (MUTATION.md § The measure-all baseline):
# mutmut over a random sample of the mutants in vera/, a cycle a night or
# two, so the whole tree is measured often and no run is a marathon.
# `scripts/mutate_sweep.py` plans each night from the state the last night
# left, and each of the night's jobs runs its slice of that plan; the stitch
# job folds the slices into the state, kept as the `mutation-sweep-state`
# artifact for 90 days.  When a cycle closes, the artifact holds the
# `mutation-summary.csv` and `mutation.json` a pull request commits (the
# README badge reads `mutation.json` on main), the score with its 95%
# interval.
#
# Each mutant is kept as the engine decides it, and the next night plans
# the mutants still undecided, so a budget stop is a normal stop.  Each
# slice runs two mutmut workers, and the oracle plugin ends a mutant's run
# at 2,400 s as `slow`: decided, counted apart, never caught.  A slice runs
# under a memory bound (a systemd scope set up with sudo, the hosted
# runner's own), so a run the kernel ends there is `memory` and the runner
# lives; it uploads its record in legs, so a lost runner keeps what its legs
# decided, and a mutant in flight on two lost slices is `lost`.  A slice whose
# engine or lane fails, more than two slices with no record, or a second
# night in a row that decides no mutant ends the run red, and on the
# schedule the `issue` job files or updates one tracking issue (the
# `mutation-sweep` label), as nightly-stress.yml does.  Survivors are the
# measurement, never a failure.  The sweep jobs read the repository and the
# last night's artifact and write nothing back; only the `issue` job can
# write, and only issues.  Every context value reaches a shell through `env`.

on:
  schedule:
    # 21:00 UTC, clear of nightly-matrix.yml's run and nightly-stress.yml's.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "The night's jobs (each plans the same night and runs its slice)"
        type: number
        default: 1

permissions:
  contents: read

# One night at a time, and a running night is never cancelled: the next one
# plans from the state this one leaves.  A night still waiting in the group
# gives way to a newer one, which loses nothing: it has planned nothing yet.
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  setup:
    permissions:
      contents: read
      # Find the last night's state artifact.
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
      slices: ${{ steps.jobs.outputs.slices }}
      state-run: ${{ steps.state.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The schedule runs mutate_sweep.JOBS jobs; a dispatch runs the number
      # it is given, one by default.
      - id: jobs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.jobs }}
        run: |
          matrix=$(python3 scripts/mutate_sweep.py matrix --event "$EVENT" --requested "$REQUESTED")
          echo "$matrix" >> "$GITHUB_OUTPUT"

      # The run whose state the night carries on from: the newest completed
      # run of this workflow on this repository's own main, started by the
      # schedule or a dispatch, with an unexpired state artifact (a fork's
      # run on a branch named main, or another workflow's, could upload an
      # artifact of the same name); none before the first night.  A lookup
      # that fails fails the night: "no state" comes only from listings that
      # succeeded, so an API error never restarts the cycle.
      - id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          found=$(python3 scripts/mutate_sweep.py find-state --repo "$REPO" --repo-id "$REPO_ID")
          echo "$found" >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    permissions:
      contents: read
      # Download the last night's state artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.setup.outputs.slices) }}
    runs-on: ubuntu-24.04
    # The script's budget (--budget, 4.5 h) plus installing the lock, the
    # sweep's own tests, the plan, the scratch tree and the engine's grace on
    # a stop, inside a hosted job's 6 h.  The legs wait inside the budget,
    # beside the slice.  A job that reached this timeout would read to the
    # stitch as a lost runner, so it holds all of that with room to spare.
    timeout-minutes: 330
    # A hosted runner taken away under a slice (the nights of 19 and 20
    # October 2026, #1751) fails its job with nothing uploaded.  The stitch
    # decides the night from the records it has, and the run's colour
    # follows the stitch, not the slice.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The engine is uv.lock's, as is everything it runs with: `--locked`
      # refuses a lock that pyproject.toml has moved past rather than
      # resolving afresh, so a release reaches a night only through a lock
      # bump, a reviewed pull request that mutation-diff.yml's self-tests
      # run on.  The state compares the engine's version exactly, and a new
      # version starts every function afresh, so a bump that moves mutmut
      # restarts the cycle (MUTATION.md § The engine and a refused state).
      # Every later step runs the synced environment's python, pytest and
      # mutmut.
      - name: Install dependencies
        run: |
          pip install "uv>=0.5,<2"
          uv sync --locked --extra mutation --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Test the sweep against the engine it installs
        run: pytest tests/test_mutate_sweep.py tests/test_mutate_diff.py -q

      - name: Download the last night's state
        if: needs.setup.outputs.state-run != ''
        uses: actions/download-artifact@v8
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-in
          run-id: ${{ needs.setup.outputs.state-run }}
          github-token: ${{ github.token }}

      # The slice runs in the background, across the steps below, inside a
      # transient systemd scope whose memory is bounded at the runner's less
      # 2.5 GiB with no swap (scripts/mutate_sweep.py's scope_command): when
      # a mutant's run outgrows it, the kernel ends that run, not the runner.
      # A bound that cannot be set fails this step, and the slice is a lane
      # stop; it never runs unbounded.  The step returns once the slice has
      # checked its bound.
      - name: Start this slice under the memory bound
        env:
          SLICE: ${{ matrix.slice }}
          JOBS: ${{ needs.setup.outputs.jobs }}
        run: >-
          python scripts/mutate_sweep.py start
          --slice "$SLICE" --live "$RUNNER_TEMP/live"
          --
          --slice "$SLICE" --of "$JOBS"
          --state "$RUNNER_TEMP/state-in"
          --budget 16200
          --max-children 2
          --mutant-cap 2400
          --workdir "$RUNNER_TEMP/sweep"
          --out "$RUNNER_TEMP/slice"

      # A lost runner takes its job's log with it and uploads nothing after
      # the loss, so the slice's record goes up in legs: each leg waits
      # (printing the slice's output into this job's log) until the slice has
      # run thirty minutes more, then uploads its partial record.  The stitch
      # reads a slice's legs only when its final record never came.  Every
      # leg and leg upload continues on error: a leg is evidence, and one
      # that fails never ends the slice, so the finish step and the final
      # record's upload run whatever the legs did.
      - name: Leg 0, the plan
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 0
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/0"

      - name: Upload leg 0
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-0
          path: ${{ runner.temp }}/legs/0/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 1, 30 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 1
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/1"

      - name: Upload leg 1
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-1
          path: ${{ runner.temp }}/legs/1/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 2, 60 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 2
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/2"

      - name: Upload leg 2
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-2
          path: ${{ runner.temp }}/legs/2/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 3, 90 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 3
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/3"

      - name: Upload leg 3
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-3
          path: ${{ runner.temp }}/legs/3/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 4, 120 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 4
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/4"

      - name: Upload leg 4
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-4
          path: ${{ runner.temp }}/legs/4/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 5, 150 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 5
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/5"

      - name: Upload leg 5
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-5
          path: ${{ runner.temp }}/legs/5/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 6, 180 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 6
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/6"

      - name: Upload leg 6
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-6
          path: ${{ runner.temp }}/legs/6/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 7, 210 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 7
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/7"

      - name: Upload leg 7
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-7
          path: ${{ runner.temp }}/legs/7/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 8, 240 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 8
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/8"

      - name: Upload leg 8
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-8
          path: ${{ runner.temp }}/legs/8/
          retention-days: 3
          if-no-files-found: ignore

      - name: Leg 9, 270 minutes in
        continue-on-error: true
        run: >-
          python scripts/mutate_sweep.py leg --leg 9
          --live "$RUNNER_TEMP/live" --out "$RUNNER_TEMP/legs/9"

      - name: Upload leg 9
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}-leg-9
          path: ${{ runner.temp }}/legs/9/
          retention-days: 3
          if-no-files-found: ignore

      # No `if:`: it runs when the steps up to the start succeeded, which
      # the legs before it cannot change, and never on a cancelled run.
      - name: Mutate this slice of the night
        run: >-
          python scripts/mutate_sweep.py finish
          --live "$RUNNER_TEMP/live"
          --summary "$GITHUB_STEP_SUMMARY"

      # A step that fails while the runner is still there (the install, the
      # sweep's own tests, the state download, the bound, or the slice ending
      # with no record) leaves no final record either; this one writes a
      # lane record in its place, with what the slice's last partial record
      # decided, so the stitch reports the slice rather than reading it as a
      # lost runner.
      - name: Record a lane that failed before the sweep ran
        if: failure()
        env:
          SLICE: ${{ matrix.slice }}
          JOBS: ${{ needs.setup.outputs.jobs }}
        run: >-
          python scripts/mutate_sweep.py lane-failed
          --slice "$SLICE" --of "$JOBS"
          --state "$RUNNER_TEMP/state-in"
          --live "$RUNNER_TEMP/live"
          --out "$RUNNER_TEMP/slice"
          --why "a step of the slice failed before it wrote its record"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the slice's record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/slice/
          retention-days: 7

  stitch:
    needs: [setup, sweep]
    if: always() && needs.setup.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the last night's state
        if: needs.setup.outputs.state-run != ''
        uses: actions/download-artifact@v8
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-in
          run-id: ${{ needs.setup.outputs.state-run }}
          github-token: ${{ github.token }}

      - name: Download the slices' records
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-sweep-slice-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true

      # A slice of a cancelled run ends with no final record, as a lost
      # runner's does, so the stitch is told the run was cancelled and
      # charges no loss for it.  A job's own timeout cannot be told from a
      # lost runner; the sweep job's timeout holds the budget, the engine's
      # grace and the legs, so it does not arise.
      - name: Fold the night into the state
        env:
          JOBS: ${{ needs.setup.outputs.jobs }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
        run: >-
          python scripts/mutate_sweep.py stitch
          --sweep-result "$SWEEP_RESULT"
          --state "$RUNNER_TEMP/state-in"
          --slices "$RUNNER_TEMP/slices"
          --of "$JOBS"
          --out "$RUNNER_TEMP/state-out"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-sweep-state
          path: ${{ runner.temp }}/state-out/
          retention-days: 90

  # A tracking issue when a scheduled night stops short: the stitch failed,
  # or never ran because the setup failed.  A slice's own failure is the
  # stitch's to judge (a lost runner is noted, not filed).  A dispatched run
  # is watched by whoever started it.
  issue:
    needs: [setup, sweep, stitch]
    if: always() && github.event_name == 'schedule' && needs.stitch.result != 'success'
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const LABEL = "mutation-sweep";
            const TITLE = "Nightly mutation sweep stopped short on main (tracking)";
            const sha = process.env.COMMIT_SHA;
            const body = [
              `The nightly mutation sweep stopped short against \`${sha.slice(0, 7)}\` (commit ${sha}): a slice whose engine or lane failed, records that disagree, more than two slices with no record in one night, a plan with nothing in it while the cycle is open, a second night in a row that decided no mutant, or a slice lost two nights running on the same plan with no mutant of it decided.  A budget stop is a normal stop: each mutant is kept as it is decided, and the next night plans the rest.`,
              ``,
              `**Run**: ${process.env.RUN_URL}`,
              ``,
              `The stitch job's summary names what stopped it; each slice's record is its \`mutation-sweep-slice-<n>\` artifact.  Survivors never file this issue.  MUTATION.md § The measure-all baseline has the sweep's rules.`,
            ].join("\n");
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: LABEL,
                color: "d73a4a", description: "The nightly mutation sweep stopped short on main",
              });
            }
            // Issues only: listForRepo also returns pull requests.
            const { data: candidates } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: "open", per_page: 10,
            });
            const open = candidates.filter(item => !item.pull_request);
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
              core.info(`Commented on #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL],
              });
              core.info(`Filed #${created.number}`);
            }
