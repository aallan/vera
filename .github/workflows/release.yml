name: Release

on:
  # The full test matrix runs after the merge, not on the pull request
  # (ci.yml, the push event the merge produces on main), so a release
  # starts when CI's run on the commit completes, and the gate below goes
  # on only when that run succeeded.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Registry path to exercise
        required: true
        type: choice
        options:
          - testpypi
          - production-recovery
      confirm_version:
        description: Exact X.Y.Z version currently in pyproject.toml
        required: true
        type: string

# A version is immutable. Never cancel or overlap release attempts, and keep
# every one that waits: without `queue: max` a group holds one pending run,
# which a newer arrival replaces.
concurrency:
  group: vera-release
  cancel-in-progress: false
  queue: max

# Every job opts into only the permissions it needs. In particular, the job
# that executes the build has no OIDC token, and OIDC jobs execute no project
# code: they only download and publish the already-tested artifact.
permissions: {}

jobs:
  # The gate.  A completed CI run starts this workflow, and the gate goes
  # on only for a successful run of the push event on main in this
  # repository: CI also completes for pull requests, a fork's among them,
  # whose head branch can be named main too, and for the nightly run.  It
  # names the commit that run tested, and every later job reads that one:
  # under workflow_run the event's own commit is main's tip when the event
  # fires, which a later merge can have moved past the tested commit.  A
  # dispatch passes the gate.  Every other job needs this one.  It plans the
  # merge and a production recovery with prepare's own steps, so a run they
  # refuse fails here at once, and a recovery, which no CI run started,
  # waits where it will publish to PyPI for CI's push run on the dispatched
  # commit (scripts/await_ci.py, at most 180 minutes).  A merge that
  # releases nothing holds the release group for seconds.
  ci:
    name: Gate on CI's run for this commit
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The pypi environment's approval page shows the event's commit,
      # main's tip, so the summary names the one this run releases.
      - name: Name the commit this run releases
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          if ! printf '%s' "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::not a commit SHA: '$SHA'"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "Commit: \`$SHA\`"
            if [ -n "$CI_RUN" ]; then
              echo ""
              echo "CI run: $CI_RUN"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The checkout is the commit, so its first parent is the main the
      # merge went into.
      - name: Does this merge publish to PyPI?
        id: push
        if: github.event_name == 'workflow_run'
        run: >-
          python scripts/release.py prepare
          --mode push
          --before-ref "HEAD^1"
          --github-output "$GITHUB_OUTPUT"

      - name: Does this recovery publish to PyPI?
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production-recovery'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          REF_NAME: ${{ github.ref }}
        run: >-
          python scripts/release.py prepare
          --mode production-recovery
          --ref-name "$REF_NAME"
          --confirm-version "$CONFIRM_VERSION"
          --github-output "$GITHUB_OUTPUT"

      - name: Wait for CI's run on this commit to succeed
        if: steps.recovery.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: python scripts/await_ci.py --commit "$RELEASE_SHA" --workflow ci.yml --event push

  prepare:
    name: Plan and validate release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.push.outputs.publish || steps.testpypi.outputs.publish || steps.recovery.outputs.publish }}
      target: ${{ steps.push.outputs.target || steps.testpypi.outputs.target || steps.recovery.outputs.target }}
      version: ${{ steps.push.outputs.version || steps.testpypi.outputs.version || steps.recovery.outputs.version }}
      artifact: ${{ steps.push.outputs.artifact || steps.testpypi.outputs.artifact || steps.recovery.outputs.artifact }}
      sha: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect a production version bump
        id: push
        if: github.event_name == 'workflow_run'
        run: >-
          python scripts/release.py prepare
          --mode push
          --before-ref "HEAD^1"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate an explicit TestPyPI staging run
        id: testpypi
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: >-
          python scripts/release.py prepare
          --mode testpypi
          --confirm-version "$CONFIRM_VERSION"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate a guarded production recovery
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production-recovery'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          REF_NAME: ${{ github.ref }}
        run: >-
          python scripts/release.py prepare
          --mode production-recovery
          --ref-name "$REF_NAME"
          --confirm-version "$CONFIRM_VERSION"
          --github-output "$GITHUB_OUTPUT"

      - name: Refuse an existing TestPyPI version
        if: steps.testpypi.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.testpypi.outputs.version }}
        run: >-
          python scripts/release.py assert-absent
          --index testpypi
          --version "$VERSION"

      - name: Refuse an existing PyPI version
        if: steps.push.outputs.publish == 'true' || steps.recovery.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.push.outputs.version || steps.recovery.outputs.version }}
        run: >-
          python scripts/release.py assert-absent
          --index pypi
          --version "$VERSION"

      - name: Refuse an existing GitHub Release
        if: steps.push.outputs.publish == 'true' || steps.recovery.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.push.outputs.version || steps.recovery.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::GitHub Release v${VERSION} already exists; releases are immutable"
            exit 1
          fi

  build:
    name: Build and test release archives
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build and inspect distribution archives
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py dist

      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/veralang-release-smoke"
          "$RUNNER_TEMP/veralang-release-smoke/bin/python" -m pip install dist/*.whl
          cp examples/hello_world.vera "$RUNNER_TEMP/hello_world.vera"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/veralang-release-smoke/bin/vera" version
          "$RUNNER_TEMP/veralang-release-smoke/bin/vera" check hello_world.vera
          run_out="$("$RUNNER_TEMP/veralang-release-smoke/bin/vera" run hello_world.vera)"
          printf '%s\n' "$run_out"
          case "$run_out" in
            *"Hello, World!"*) ;;
            *) echo "::error::wheel smoke: unexpected 'vera run' output"; exit 1 ;;
          esac

      - name: Create release notes and checksum manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/release.py notes \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --output release/RELEASE_NOTES.md
          python scripts/release.py manifest \
            --dist-dir dist \
            --output release/SHA256SUMS

      - name: Upload the tested release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release/RELEASE_NOTES.md
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [prepare, build]
    if: needs.prepare.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/veralang
    permissions:
      id-token: write
    steps:
      - name: Download the tested release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: artifact

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1), 2026-07-30
        with:
          packages-dir: artifact/dist/
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  verify-testpypi:
    name: Verify TestPyPI archives
    needs: [prepare, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download the tested release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: artifact

      - name: Verify registry filenames and SHA-256 hashes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python scripts/release.py verify-registry
          --index testpypi
          --version "$VERSION"
          --dist-dir artifact/dist

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    if: needs.prepare.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/veralang
    permissions:
      id-token: write
    steps:
      - name: Download the tested release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: artifact

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1), 2026-07-30
        with:
          packages-dir: artifact/dist/
          print-hash: true

  verify-pypi:
    name: Verify PyPI archives
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Download the tested release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: artifact

      - name: Verify registry filenames and SHA-256 hashes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python scripts/release.py verify-registry
          --index pypi
          --version "$VERSION"
          --dist-dir artifact/dist

  github-release:
    name: Tag and create GitHub Release
    needs: [prepare, verify-pypi]
    if: needs.prepare.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: artifact

      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/v${VERSION}" \
            --jq .object.sha 2>/dev/null || true)"
          # gh api prints the 404 error body on stdout, so an absent tag
          # captures error JSON rather than an empty string — treat anything
          # that is not a 40-hex SHA as "tag does not exist".
          if ! printf '%s' "$tag_sha" | grep -qE '^[0-9a-f]{40}$'; then
            tag_sha=""
          fi
          if [ -z "$tag_sha" ]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v${VERSION}" \
              -f sha="$RELEASE_SHA"
          elif [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::immutable tag v${VERSION} points at ${tag_sha}, not ${RELEASE_SHA}"
            exit 1
          fi

          # Latest only when no higher version is released: releases start
          # in the order their merges' CI runs complete, which a second
          # version-raising merge's can beat.  A tag with no published
          # Release is no rival.  A failed read stops the step (bash -e),
          # and so does an empty one, which gh's --paginate can return with
          # exit 0: this repository always has Releases.
          released="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | ltrimstr("v")')"
          if [ -z "$released" ]; then
            echo "::error::the Releases listing came back empty, so Latest cannot be decided"
            exit 1
          fi
          highest="$(printf '%s\n%s\n' "$released" "$VERSION" \
            | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1)"
          latest=false
          if [ "$highest" = "$VERSION" ]; then
            latest=true
          fi

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file artifact/release/RELEASE_NOTES.md \
            --latest="$latest" \
            artifact/dist/*.whl \
            artifact/dist/*.tar.gz \
            artifact/release/SHA256SUMS
