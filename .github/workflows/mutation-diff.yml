name: Mutation (diff)

# The diff-scoped mutation lane (MUTATION.md § CI): mutmut over the
# functions a pull request changes, in a scratch tree, with a table of
# what became of each function's mutants and the survivors' diffs in the
# job summary, and the JSON record kept as an artifact.  It is red for a
# defect and green for an unfinished run: it fails on a survivor (exit 1)
# and on a run the engine or the lane itself stops (exit 2), and a run its
# budget stops with no survivor passes, its summary's headline and a
# warning annotation saying the run is incomplete.  No other step reads the
# script's exit status.  It is not a required check: branch protection's
# required list is the maintainer's, synced by hand.
#
# It also runs on a pull request that moves uv.lock, which names the engine
# both mutation lanes install, or either lane's own workflow, script or
# self-tests: the job runs both lanes' self-tests against the engine it
# installs, so a lock bump that breaks the engine is red on its own pull
# request, before any night runs on it.
#
# `pull_request`, not `pull_request_target`: a fork's pull request runs
# with a read-only token and no secrets.  The job reads the repository and
# writes nothing back; every context value reaches the shell through `env`.

on:
  pull_request:
    branches: [main]
    paths:
      - "vera/**/*.py"
      - "uv.lock"
      - "scripts/mutate_diff.py"
      - "scripts/mutate_sweep.py"
      - "scripts/mutation_report.py"
      - "tests/mutation_oracle.py"
      - "tests/test_mutate_diff.py"
      - "tests/test_mutate_sweep.py"
      - ".github/workflows/mutation-diff.yml"
      - ".github/workflows/mutation-nightly.yml"

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutate:
    name: mutation (diff)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # The script's budget (--budget, 40 min) plus installing the lock, both
    # lanes' self-tests and the scratch tree.
    timeout-minutes: 55
    steps:
      # The pull request's head, with the history that holds its merge base.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The engine is uv.lock's, as the nightly sweep's is: `--locked`
      # refuses a lock that pyproject.toml has moved past rather than
      # resolving afresh.  Every later step runs the synced environment's
      # python, pytest and mutmut.
      - name: Install dependencies
        run: |
          pip install "uv>=0.5,<2"
          uv sync --locked --extra mutation --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The tests that need mutmut itself (its status table, its generator
      # honouring the narrowing pragma, a night end to end) skip in the
      # shards, which install [dev] alone; here the engine is installed, so
      # they run, both lanes' as the nightly sweep runs them.
      - name: Test the lane against the engine it installs
        run: pytest tests/test_mutate_sweep.py tests/test_mutate_diff.py -q

      - name: Mutate the functions this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/mutate_diff.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --budget 2400
          --workdir "$RUNNER_TEMP/mutate-diff"
          --json "$RUNNER_TEMP/mutation-diff.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-diff
          path: ${{ runner.temp }}/mutation-diff.json
          retention-days: 30
