name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The whole test matrix once a day, on main as it stands.  The push event a
  # merged pull request produces on main runs the matrix only for a release
  # (see the test job), so this is what still runs every cell every day.
  schedule:
    - cron: "0 3 * * *"

# Cancel superseded runs of the same PR (each push restarts the matrix).
# Push runs are never cancelled: main keeps a completed check run per
# commit, which bisection relies on, and that run is the one that
# measures coverage (see the coverage job), so no pull request waits on it.
# A run queued behind another in its group waits, so the nightly run has a
# group of its own and never holds a merge's push run pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a push raised [project].version: the release-mode rule of
  # scripts/check_doc_counts.py (#1536), asked of the commit before the
  # push.  The test matrix reads the answer.  On a pull request or the
  # nightly run its steps do not run, and the job finishes in seconds.
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          # The commit before the push, whose pyproject.toml is compared.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Did this push raise [project].version?
        id: release
        if: github.event_name == 'push'
        run: python scripts/check_doc_counts.py --print-release-mode "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    # Every cell on a pull request, on the nightly run, and on the push event
    # a merged pull request produces on main when the merge raised
    # [project].version (a release).  On the push event any other merge
    # produces, the pull request's last run has already tested that tree on
    # every cell (branch protection requires the branch to be up to date), so
    # the matrix stands down and no push run holds macOS and Windows runners
    # that the next pull request's cells queue behind; the coverage job runs
    # the suite instead.  A job-level `if` cannot see the matrix, so the cell
    # that measures coverage is that job rather than a cell kept here.
    if: github.event_name != 'push' || needs.plan.outputs.release == 'true'
    permissions:
      contents: read
    strategy:
      # #848: don't let one failed combo cancel the other 12 — a single
      # flaky test cancelled two otherwise-green matrices on PR #846.
      # Full per-run results also make real cross-platform breakage
      # (one OS red, others green) legible at a glance.
      fail-fast: false
      matrix:
        # Explicit macOS pins (not `macos-latest`) so we don't silently
        # migrate when GitHub flips the `-latest` alias.  See README §Supported
        # platforms for the policy.  `macos-15` (Sequoia) is currently
        # `macos-latest` (May 2026) and the most common single non-current
        # version among real users (~24% of macOS install base per
        # https://telemetrydeck.com/survey/apple/macOS/versions/); `macos-26`
        # (Tahoe) is current and dominant (~75%).
        os: [ubuntu-latest, macos-15, macos-26, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # #702: real end-to-end Linux aarch64 coverage — platform
          # coverage, not python-version coverage, so one job only.
          - os: ubuntu-24.04-arm
            python-version: "3.12"

    # The ' + coverage' suffix is the name of a required status check; it
    # stays until the branch-protection list is updated with the fast lane,
    # although the coverage job now measures coverage and this cell does not.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' && ' + coverage' || '' }}
    runs-on: ${{ matrix.os }}
    # No PYTHONUTF8 env: #645 made text I/O UTF-8 without the PEP-540 backstop
    # (#641).  Every text-mode open()/read_text()/write_text() and every
    # subprocess text=True capture passes an explicit encoding="utf-8" (enforced
    # by scripts/check_explicit_encoding.py), and the `vera` CLI reconfigures its
    # stdout/stderr to UTF-8 at startup — so a Vera program printing `→` / `—` is
    # UTF-8 on every runner regardless of locale, cp1252 Windows included.

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Uninstrumented on every cell: the coverage job measures coverage.
      # -n auto runs tests in parallel across CPU cores via pytest-xdist.
      - name: Run tests
        run: pytest -v -n auto

  coverage:
    if: github.event_name == 'push'
    # The push event every merged pull request produces on main measures
    # coverage here, with the sysmon core (Python 3.12+), and uploads it,
    # which keeps Codecov tracking main.  An instrumented run costs about
    # 2.5x an uninstrumented one, so no pull request waits on it.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: pytest -v -n auto --cov=vera --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy vera/

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so check_changelog_updated.py can diff against
          # origin/main.  Other lint checks work fine without it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check CHANGELOG updated for substantive changes
        # PR-level escape hatch: adding the "skip-changelog" label
        # skips this step for PRs that legitimately don't need an entry
        # (e.g., a typo fix in a code comment).  The step always runs
        # for push events on main.
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: python scripts/check_changelog_updated.py

      # The conformance suite is not repeated here: tests/test_conformance.py
      # runs it inside the suite (the script stays for local use).  The
      # examples' check + verify stays, as the one run of `vera check` and
      # `vera verify` through the CLI over every example: the suite's example
      # tests call the checker and verifier in-process.
      - name: Check all examples type-check and verify cleanly
        run: python scripts/check_examples.py

      - name: Check the corpus is in canonical form
        run: python scripts/check_corpus_canonical.py

      - name: Check vera run commands in examples/README.md are valid
        run: python scripts/check_examples_readme.py

      - name: Check version numbers are in sync
        run: python scripts/check_version_sync.py

      - name: Check every agent-facing document's Vera blocks parse, check, verify and run (#1481)
        run: python scripts/check_doc_examples.py

      - name: Check spec EBNF and Lark grammar agree on rule names (#683)
        run: python scripts/check_grammar_alignment.py

      - name: Check vera:diagnostic examples match live output
        run: python scripts/check_diagnostic_examples.py

      - name: Check no doc example redefines a built-in (E151)
        run: python scripts/check_doc_builtin_shadowing.py

      - name: Check no unexpected [E602]/[E604] silent skips (Layer 1 of #626)
        run: python scripts/check_e602_clean.py

      - name: Check every example runs trap-free or carries a skip property
        run: python scripts/check_examples_run.py

      - name: Check every runtime-check claim against the checks the corpus compiles to (T2a)
        run: python scripts/check_reconciliation.py

      - name: Check editor grammars and READMEs carry every built-in effect (#1156)
        run: python scripts/check_editor_grammars.py

      - name: Check every diagnostic carries rationale/fix/spec_ref (#682)
        run: python scripts/check_diagnostic_fields.py

      - name: Check every walker covers every Expr subclass (#597)
        run: python scripts/check_walker_coverage.py

      - name: Check text-mode file I/O passes explicit encoding (#645)
        run: python scripts/check_explicit_encoding.py

      - name: Check site assets are up-to-date
        run: python scripts/check_site_assets.py

      - name: Check license compliance
        run: python scripts/check_licenses.py

      - name: Check documentation counts are consistent
        # The headline test totals are checked against the live collection
        # on a change that raises [project].version (the release PR, whatever
        # its base, and the push event its merge produces on main), and
        # against one another only on every other change, since every fix PR
        # moves them (#1536).  A pull request is compared with its base
        # branch, a push with the commit before it, and the nightly run,
        # which has no commit before it, with the commit it tests, which
        # raises nothing.  The rule is in scripts/check_doc_counts.py.
        run: python scripts/check_doc_counts.py --release-if-version-raised "${{ github.event_name == 'pull_request' && github.base_ref || github.event.before || github.sha }}"

      - name: Check limitation tables are in sync
        run: python scripts/check_limitations_sync.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Security lint (ruff S rules)
        run: ruff check --select S vera/

      - name: Hygiene hooks (pre-commit-hooks) on every file
        # The local hook runs these on the files a commit stages; here they
        # cover every file, so a commit that skipped the hook is still held
        # to them.  check-added-large-files stays at the commit: it inspects
        # the files a commit ADDS, which only the commit's own index records.
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-toml check-merge-conflict debug-statements; do
            pre-commit run --all-files --show-diff-on-failure "$hook"
          done

      - name: Verify uv.lock is up to date
        run: |
          pip install "uv>=0.5,<2"
          uv lock --check

  security:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: pip install -e . && pip install pip-audit

      - name: Audit dependencies for known CVEs
        # --skip-editable: vera itself is a local editable install, not on PyPI
        run: pip-audit --skip-editable

  wheel-preflight:
    # Structural backstop for #691-class regressions: if an upstream dep
    # bumps its platform-tag baseline (e.g. z3-solver going from
    # macosx_13_0_arm64 to macosx_15_0_arm64 between 4.15.4 and 4.15.5),
    # this job fails fast in CI rather than letting users discover the
    # regression at install time on their machine.  Pairs with the
    # README §Supported platforms policy; the script enforces what the
    # README documents.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check wheel availability across supported platforms
        run: python scripts/check_wheel_availability.py

  package-distribution:
    # Build the exact artifacts that will eventually be uploaded under
    # the `veralang` distribution name (#737).  This stays separate from
    # release automation (#481): PR CI validates artifacts but publishes
    # nothing.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: pip install build twine

      - name: Build and inspect distribution archives
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py dist

      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/veralang-wheel-smoke"
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/python" -m pip install dist/*.whl
          cp examples/hello_world.vera "$RUNNER_TEMP/hello_world.vera"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" version
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" check hello_world.vera
          run_out="$("$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" run hello_world.vera)"
          printf '%s\n' "$run_out"
          case "$run_out" in
            *"Hello, World!"*) ;;
            *) echo "::error::wheel smoke: unexpected 'vera run' output"; exit 1 ;;
          esac

  sbom:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Generate an SBOM on the push event every merged pull request produces
    # on main.  PRs get the artifact too, useful for reviewing dependency
    # changes.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install vera and CycloneDX tooling
        run: pip install -e . && pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  eager-gc:
    # #1379/#1382: `VERA_EAGER_GC=1` forces a collection at every `$alloc`,
    # which turns a rooting bug from a timing accident into a deterministic
    # failure (ENVIRONMENT.md).  Both defects this lane would have caught
    # were found by hand; without the lane the class re-enters silently,
    # because the ordinary run is green on exactly the programs that fail
    # here.  Its own job rather than a step on `test`: it re-runs every
    # run-level conformance program and every runnable example under a knob
    # that makes them slower, and a failure here should name itself rather
    # than arrive as a line inside the main suite's output.  The conformance
    # programs go through the suite's own run stage (`test_run`); a
    # collection changes what a program does only when it runs, so the
    # parse, check and verify stages are not repeated here.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Conformance runs under eager GC
        run: pytest tests/test_conformance.py -k run -n auto
        env:
          VERA_EAGER_GC: "1"

      - name: Examples run under eager GC
        run: python scripts/check_examples_run.py
        env:
          VERA_EAGER_GC: "1"

  browser-parity:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run browser parity tests
        run: pytest tests/test_browser.py -v
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      - name: Generate JS coverage report
        if: always()
        run: npx c8 report --temp-directory="${{ runner.temp }}/v8-coverage" --reporter=lcov --report-dir=./js-coverage --src=vera/browser/

      - name: Upload JS coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: js-coverage/lcov.info
          flags: javascript
          fail_ci_if_error: false
