name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The nightly run: nightly-matrix.yml calls this workflow on its schedule,
  # and on demand, with `nightly: true`, which runs the full test matrix and
  # the watched images (the test and watch jobs).  Its runs are that
  # workflow's, carrying its name and event, so release.yml, which starts on
  # the completion of CI's runs, hears none of them.
  workflow_call:
    inputs:
      nightly:
        description: "Run the full test matrix and the watched images, as the nightly run does"
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

# Cancel superseded runs of the same PR (each push restarts the run).
# A push run has a group of its own, its commit: a group holds one pending
# run, which a newer arrival replaces, so a push run that shared main's
# group could be dropped before it ran.  Each commit on main keeps a
# completed run, which bisection relies on, and whose completion starts
# release.yml; that run measures coverage (see the coverage job), so
# no pull request waits on it.  The nightly run has a group of its own too:
# a called workflow's `github.workflow` is its caller's, Nightly matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job's name is spelled out, since the names are what branch
# protection requires.
jobs:
  # What the other jobs read.  On a pull request and on a push, whether the
  # change raises [project].version: the release-mode rule of
  # scripts/check_doc_counts.py (#1536), asked of a pull request's head
  # against its base and of a push against the commit before it, which
  # decides whether the full test matrix runs.  On a pull request, also the
  # files it changes that a class-instrument matrix can be decided by, so a
  # matrix whose file or deciding module changed runs every cell
  # (tests/matrix_sample.py), and whether every file it changes is inert,
  # which decides whether the filtered jobs run (scripts/ci_changes.py).  On
  # the nightly run its steps do not run, and the job finishes in seconds.
  plan:
    name: plan
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      changed: ${{ steps.changed.outputs.changed }}
      inert: ${{ steps.inert.outputs.inert }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # A pull request's head, whose pyproject.toml is compared with its
          # base's, or the pushed commit; with the whole history, which holds
          # the commit before a push and a pull request's base and the merge
          # base its changes are listed from.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Does this change raise [project].version?
        id: release
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_doc_counts.py --print-release-mode "$BASE" >> "$GITHUB_OUTPUT"

      # The pull request's own changes, from its merge base (three dots),
      # not what main has gained since it branched.  Only the paths a matrix
      # can be decided by, the compiler, the test files and
      # scripts/mutate_diff.py, the one script a matrix decides on, which
      # keeps the list far below the 32,767 characters an environment
      # variable can hold on Windows.  The delimiter is random, so no file
      # name can end the value early.
      - name: Which files does this pull request change?
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          delimiter="changed_$(openssl rand -hex 16)"
          echo "changed<<$delimiter" >> "$GITHUB_OUTPUT"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" -- vera/ 'tests/test_*.py' scripts/mutate_diff.py >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      # The path filter.  `inert=true` when every file the pull request
      # changes, from its merge base, is one of the VS Code extension's own,
      # which vscode-extension.yml builds and tests and no filtered job reads
      # (scripts/ci_changes.py says which).  The filtered jobs then stand
      # down: a job its own `if:` skips reports success under its name, which
      # satisfies a required check, and the shard job's cells, whose names a
      # skipped matrix job would not report, run and skip each step.  The
      # filters test `!= 'true'`, so where this step does not run (a push,
      # the nightly run) every job runs, and a failure here fails the plan
      # job, and matrix-gate with it.
      - name: Does this pull request change only files no filtered job reads?
        id: inert
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # The pull request's suite: Python 3.12 on Linux in three shards and on
  # Windows in two.  A test belongs to the shard its node id hashes to
  # (tests/shard.py), so the shards are the suite between them and no
  # durations file needs keeping.  Each shard runs the class-instrument
  # matrices' weekly sample, and every cell of one whose file or deciding
  # module the pull request changes, from the plan job's list.  A shard's
  # xdist workers steal queued tests from one another (--dist worksteal),
  # so a worker left with two long tests does not hold the shard's end.
  # Every cell's name is a required check.  On a pull request whose every
  # file is inert (the plan job's `inert`), each cell runs and skips its
  # steps, so it still reports under its name: a matrix job skipped by its
  # own `if:` would report one check under its unexpanded name instead.
  shard:
    name: test (${{ matrix.os }}, 3.12, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: plan
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      # One failed shard does not cancel the others, so a run shows every
      # failure at once.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: 1, shards: 3 }
          - { os: ubuntu-24.04, shard: 2, shards: 3 }
          - { os: ubuntu-24.04, shard: 3, shards: 3 }
          - { os: windows-2025-vs2026, shard: 1, shards: 2 }
          - { os: windows-2025-vs2026, shard: 2, shards: 2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        if: needs.plan.outputs.inert != 'true'
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        if: needs.plan.outputs.inert != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: needs.plan.outputs.inert != 'true'
        run: pip install -e ".[dev]"

      # bash on every runner: a Windows runner's default shell, pwsh, reads
      # `$SHARD` as a PowerShell variable of its own, which is empty.
      - name: Run tests
        if: needs.plan.outputs.inert != 'true'
        shell: bash
        env:
          VERA_MATRIX_CHANGED: ${{ needs.plan.outputs.changed }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: pytest -v -n 4 --dist worksteal --shard="$SHARD"

  # The full OS x Python matrix: on a pull request that raises
  # [project].version, on the push event its merge produces on main (a
  # release), and on the nightly run (`inputs.nightly`, nightly-matrix.yml's
  # call, scheduled or dispatched).  Every other pull request runs the suite
  # in the shard job above, on Linux and Windows under Python 3.12, and the
  # push event any other merge produces runs it once, in the coverage job,
  # so no ordinary run holds the macOS runners that the next pull request's
  # checks would queue behind.  Its cells are not required checks:
  # matrix-gate is, and passes only when the matrix ran and passed wherever
  # the version rises.  A cell that fails on a push or scheduled nightly
  # run files an issue (matrix-issue).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: plan
    if: inputs.nightly || needs.plan.outputs.release == 'true'
    # The advisory cell may fail without failing the job, so neither the
    # run, nor matrix-gate, nor matrix-issue turns on it.
    continue-on-error: ${{ matrix.advisory }}
    # The number of cells the matrix runs, which every cell states alike:
    # matrix-gate holds the run's job listing to it, so a cell missing from
    # the listing fails the gate.
    outputs:
      cells: ${{ strategy.job-total }}
    permissions:
      contents: read
    strategy:
      # #848: don't let one failed combo cancel the other 12 — a single
      # flaky test cancelled two otherwise-green matrices on PR #846.
      # Full per-run results also make real cross-platform breakage
      # (one OS red, others green) legible at a glance.
      fail-fast: false
      matrix:
        # Explicit images, never a `-latest` label, so no cell migrates
        # when GitHub moves one; the watch job runs the floating labels on
        # the nightly run.  See README §Supported platforms for the policy.
        # `ubuntu-24.04` is the LTS release README names for x86_64, as
        # `ubuntu-24.04-arm` is for aarch64.  `macos-15` (Sequoia) is the
        # most common single non-current version among real users (~24% of
        # macOS install base per
        # https://telemetrydeck.com/survey/apple/macOS/versions/); `macos-26`
        # (Tahoe) is current and dominant (~75%), and `macos-latest` names it
        # since June 2026 (actions/runner-images#14167).
        # `windows-2025-vs2026` is the Windows Server 2025 image by its own
        # name: GitHub moved `windows-latest` and `windows-2025` to it from
        # the Visual Studio 2022 image in June 2026
        # (actions/runner-images#14017).
        os: [ubuntu-24.04, macos-15, macos-26, windows-2025-vs2026]
        python-version: ["3.11", "3.12", "3.13"]
        advisory: [false]
        include:
          # #702: real end-to-end Linux aarch64 coverage — platform
          # coverage, not python-version coverage, so one job only.
          # Advisory (README § Supported platforms).
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            advisory: true

    runs-on: ${{ matrix.os }}
    # No PYTHONUTF8 env: #645 made text I/O UTF-8 without the PEP-540 backstop
    # (#641).  Every text-mode open()/read_text()/write_text() and every
    # subprocess text=True capture passes an explicit encoding="utf-8" (enforced
    # by scripts/check_explicit_encoding.py), and the `vera` CLI reconfigures its
    # stdout/stderr to UTF-8 at startup — so a Vera program printing `→` / `—` is
    # UTF-8 on every runner regardless of locale, cp1252 Windows included.

    steps:
      # The image the runner booted, by name and build (`ImageOS` and
      # `ImageVersion`, which every GitHub-hosted runner sets): a label
      # names an image only until GitHub moves it, and an image's build
      # changes every week.  The job's summary shows it, and a record of it
      # goes up for matrix-issue, so the issue a failed cell files says
      # which build broke.  The watch job runs these same steps, and the
      # job's id names the cell.
      - name: Record the runner image
        shell: bash
        env:
          CELL: ${{ github.job }} (${{ matrix.os }}, ${{ matrix.python-version }})
          RECORD: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/runner-image"
          printf '%s\t%s\t%s\n' "$CELL" "$ImageOS" "$ImageVersion" > "$RUNNER_TEMP/runner-image/$RECORD.tsv"
          echo "Runner image: $ImageOS $ImageVersion"
          echo "Runner image: $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"

      # `overwrite`: a re-run cell records its image again, under the name
      # its first attempt's record holds.  `continue-on-error`: the record
      # is a diagnostic, and an artifact service's error would otherwise
      # fail a cell matrix-gate reads, a release's among them; matrix-issue
      # names the images whose records it finds.
      - name: Keep the runner image's record
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runner-image-${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/runner-image/
          retention-days: 7
          overwrite: true

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Uninstrumented on every cell: the coverage job measures coverage.
      # -n auto runs tests in parallel across CPU cores via pytest-xdist.
      # A pull request runs a weekly-seeded stratified sample of each
      # class-instrument matrix (the files marked `matrix`,
      # tests/matrix_sample.py), and every cell of one whose file or
      # deciding module it changes, from the plan job's list; the release
      # push and the nightly run run every cell.
      # On a pull request no `--matrix` at all, which is the default that
      # reads VERA_MATRIX_CHANGED: an explicit `--matrix=sample` would
      # sample a changed matrix too.  Unquoted, so the empty value is no
      # argument.  Under bash on every runner, as the shards' step is: pwsh,
      # the Windows cells' default shell, would read `$MATRIX_ARGS` as empty.
      - name: Run tests
        shell: bash
        env:
          VERA_MATRIX_CHANGED: ${{ needs.plan.outputs.changed }}
          MATRIX_ARGS: ${{ github.event_name != 'pull_request' && '--matrix=full' || '' }}
        run: pytest -v -n auto $MATRIX_ARGS

  # The watched images, on the nightly run alone (`inputs.nightly`): the
  # floating `-latest` labels, which GitHub moves to a new OS release on a
  # date of its own, and the newest release image it offers that no cell of
  # the full matrix runs, at Python 3.12.  No job that runs on a push or a
  # pull request takes one of these labels, so a label GitHub moves can
  # neither block a merge nor change what a release is tested on: the full
  # matrix's images are pinned, and moving one is a reviewed change, made
  # once the watched cell of its successor has run green for as long as the
  # maintainer chooses.  A preview image joins when GitHub lists it as a
  # release image.  Each cell is advisory: a failed one fails neither the
  # run nor matrix-gate, and on a scheduled night matrix-issue files it,
  # naming the image it ran on.  Its steps are the test job's, comments apart
  # (tests/test_nightly_matrix_workflow.py holds them equal).
  watch:
    name: watch (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: plan
    if: inputs.nightly
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Record the runner image
        shell: bash
        env:
          CELL: ${{ github.job }} (${{ matrix.os }}, ${{ matrix.python-version }})
          RECORD: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/runner-image"
          printf '%s\t%s\t%s\n' "$CELL" "$ImageOS" "$ImageVersion" > "$RUNNER_TEMP/runner-image/$RECORD.tsv"
          echo "Runner image: $ImageOS $ImageVersion"
          echo "Runner image: $ImageOS $ImageVersion" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the runner image's record
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: runner-image-${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/runner-image/
          retention-days: 7
          overwrite: true

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        env:
          VERA_MATRIX_CHANGED: ${{ needs.plan.outputs.changed }}
          MATRIX_ARGS: ${{ github.event_name != 'pull_request' && '--matrix=full' || '' }}
        run: pytest -v -n auto $MATRIX_ARGS

  # The required check for the full matrix (scripts/matrix_gate.py).  It runs
  # whatever the plan and the matrix did, and passes when the plan succeeded
  # and the matrix either ran with every cell passing or was skipped because
  # the change keeps the version; a failed plan, a failed or cancelled cell,
  # or a matrix skipped on a change that raises the version fails it.  Where
  # the matrix ran it reads every cell's conclusion from the run's job
  # listing, not from the matrix's result alone, which reads `success` once
  # one of two failed cells is re-run on its own and passes (#1659), and
  # holds the listing to the matrix's size; the cells that failed are its
  # `failed` output, for matrix-issue.  On the nightly run it waits for the
  # watched images too, and names the ones that failed in its `watched`
  # output, which its verdict does not read.  A run of the nightly workflow
  # lists every job of this one under the calling job's name
  # (`CI / test (ubuntu-24.04, 3.11)`), which the script reads through.
  matrix-gate:
    name: matrix-gate
    needs: [plan, test, watch]
    if: always()
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      failed: ${{ steps.gate.outputs.failed }}
      watched: ${{ steps.gate.outputs.watched }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Did the full matrix run wherever the version rises, and pass?
        id: gate
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE: ${{ needs.plan.outputs.release }}
          TEST_RESULT: ${{ needs.test.result }}
          MATRIX_CELLS: ${{ needs.test.outputs.cells }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/matrix_gate.py

  # A failed cell on a push or scheduled nightly run, where no pull request's checks
  # show it, files one issue per workflow and branch, or comments on the
  # open one: nightly-stress.yml's pattern, deduplicated on the issue's
  # title, labelled bug and ci.  The failed cells are the ones matrix-gate
  # read from the run's job listing, so one cell re-run on its own does not
  # hide another still failed; the matrix's result files too, where the gate
  # could not read the listing.  A failed watched cell (the watch job's, on
  # the nightly run) files as well, and the issue names the image each
  # failed cell ran on, from the records the cells keep.  The nightly run
  # is nightly-matrix.yml's call of this workflow, whose `github.event_name`
  # is the caller's: `schedule` files, and a dispatched run files nothing.
  matrix-issue:
    name: matrix-issue
    needs: [test, matrix-gate]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && (needs.test.result == 'failure' || needs.matrix-gate.outputs.failed != '' || needs.matrix-gate.outputs.watched != '')
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    steps:
      # The records of the images the cells ran on.  One that cannot be
      # fetched names no image, and the issue is filed all the same.
      - name: Fetch the cells' runner images
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: runner-image-*
          path: ${{ runner.temp }}/runner-image
          merge-multiple: true

      - name: File or update the tracking issue
        uses: actions/github-script@v9
        env:
          FAILED: ${{ needs.matrix-gate.outputs.failed }}
          WATCHED: ${{ needs.matrix-gate.outputs.watched }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGES: ${{ runner.temp }}/runner-image
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const title = `${context.workflow}: full test matrix failing on ${branch}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const when = context.eventName === "schedule" ? "the nightly run" : "the push run";

            // The cells that failed, as matrix-gate read them from this
            // run's job listing: its `failed` output, the full matrix's
            // blocking cells, and its `watched` output, the watched
            // images' (each a JSON list).  The run's page lists them too,
            // which the body points to where the gate could not read the
            // listing.
            const listed = (name) => {
              try {
                const named = JSON.parse(process.env[name] || "[]");
                return Array.isArray(named) ? named.filter((cell) => typeof cell === "string").sort() : [];
              } catch (e) {
                core.warning(`cannot read matrix-gate's ${name.toLowerCase()} cells: ${e.message}`);
                return [];
              }
            };
            const cells = listed("FAILED");
            const watched = listed("WATCHED");

            // The image each cell's runner booted, from the records the
            // cells keep, a line `<cell>\t<ImageOS>\t<ImageVersion>` each.
            // A cell with no record is named without one.
            const images = new Map();
            try {
              for (const file of fs.readdirSync(process.env.IMAGES)) {
                const text = fs.readFileSync(path.join(process.env.IMAGES, file), "utf8");
                for (const line of text.split("\n")) {
                  const [cell, image, build] = line.replace(/\r$/, "").split("\t");
                  if (cell && image && build) images.set(cell, `${image} ${build}`);
                }
              }
            } catch (e) {
              core.info(`no runner image records: ${e.message}`);
            }
            const named = (list) => list
              .map((cell) => (images.has(cell) ? `\`${cell}\` on ${images.get(cell)}` : `\`${cell}\``))
              .join(", ");

            // The full matrix's failure leads where there is one; a night
            // on which a watched image alone failed says so.
            const matrix = cells.length > 0 || process.env.TEST_RESULT === "failure" || watched.length === 0;
            const lines = [
              `${matrix ? "The full test matrix" : "A watched runner image"} failed in ${when} of ${context.workflow} on \`${branch}\`, at \`${context.sha.slice(0, 7)}\` (commit ${context.sha}).`,
              "",
            ];
            if (cells.length) {
              lines.push(`Failed cells: ${named(cells)}.`, "");
            } else if (matrix) {
              lines.push("The run's page lists the failed cells.", "");
            }
            if (watched.length) {
              lines.push(`Failed watched cells, which block nothing: ${named(watched)}.`, "");
            }
            lines.push(`**Run**: ${runUrl}`);
            const body = lines.join("\n");

            for (const name of ["bug", "ci"]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, color: "d73a4a" });
                core.info(`Created label '${name}'`);
              }
            }

            // The open issue with this title, whatever labels it carries
            // now.  The listing returns pull requests too, and none of them
            // is the issue.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const existing = open.find((item) => !item.pull_request && item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.info(`Commented on the tracking issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo, title, body, labels: ["bug", "ci"],
              });
              core.info(`Filed the tracking issue #${created.number}`);
            }

  coverage:
    name: coverage
    if: github.event_name == 'push'
    # The push event every merged pull request produces on main measures
    # coverage here, with the sysmon core (Python 3.12+), and uploads it,
    # which keeps Codecov tracking main.  An instrumented run costs about
    # 2.5x an uninstrumented one, so no pull request waits on it.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          COVERAGE_CORE: sysmon
        run: pytest -v -n auto --cov=vera --cov-report=term-missing --cov-report=xml --cov-fail-under=94 --matrix=full

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  # The jobs from here to the end of the file, bar lint and security, stand
  # down on a pull request whose every file is inert (the plan job's
  # `inert`, scripts/ci_changes.py): none of them reads the VS Code
  # extension's own files.  A job its `if:` skips reports success, so a
  # required one still reports under its name.
  typecheck:
    name: typecheck
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy vera/

  lint:
    name: lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so check_changelog_updated.py can diff against
          # the pull request's base branch.  Other lint checks work fine
          # without it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check CHANGELOG updated for substantive changes
        # PR-level escape hatch: adding the "skip-changelog" label
        # skips this step for PRs that legitimately don't need an entry
        # (e.g., a typo fix in a code comment).  The step always runs
        # for push events on main.  It diffs against the pull request's
        # base branch, and against main on a push.
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_changelog_updated.py "origin/$BASE_REF"

      - name: Check every changelog.d/ fragment is well formed (#1529)
        run: python scripts/check_changelog_fragments.py

      # What the suite does over the whole tree is not repeated here, and
      # the scripts stay for local use: the conformance programs
      # (tests/test_conformance.py), the examples' check and verify
      # (tests/test_verifier_contracts.py, and tests/test_pipeline.py, which
      # holds each stage to its command), every document's Vera blocks and
      # the example runs they name (tests/test_check_doc_examples.py), and
      # the examples' runs (tests/test_check_examples_run.py).
      - name: Check the corpus is in canonical form
        run: python scripts/check_corpus_canonical.py

      - name: Check vera run commands in examples/README.md are valid
        run: python scripts/check_examples_readme.py

      - name: Check spec EBNF and Lark grammar agree on rule names (#683)
        run: python scripts/check_grammar_alignment.py

      - name: Check vera:diagnostic examples match live output
        run: python scripts/check_diagnostic_examples.py

      - name: Check no doc example redefines a built-in (E151)
        run: python scripts/check_doc_builtin_shadowing.py

      - name: Check no unexpected [E600]/[E601]/[E602] silent skips (Layer 1 of #626)
        run: python scripts/check_e602_clean.py

      - name: Check every diagnostic carries rationale/fix/spec_ref (#682)
        run: python scripts/check_diagnostic_fields.py

      - name: Check every test drives the pipeline through tests/pipeline.py
        run: python scripts/check_test_drivers.py

      - name: Check every test asks the record whether a module holds a check
        run: python scripts/check_record_assertions.py

      - name: Check text-mode file I/O passes explicit encoding (#645)
        run: python scripts/check_explicit_encoding.py

      - name: Check site assets are up-to-date
        run: python scripts/check_site_assets.py

      - name: Check license compliance
        run: python scripts/check_licenses.py

      - name: Check the generated status is current, at a release
        # TESTING.md's generated status (scripts/render_status.py) is
        # checked against the tree on a change that raises [project].version
        # (the release PR, whatever its base, and the push event its merge
        # produces on main), and not at all on any other change: between
        # releases it may lag the tree (#1536).  A pull request is compared
        # with its base branch, a push with the commit before it, and the
        # nightly run, which has no commit before it, with the commit it
        # tests, which raises nothing.  The rule is in
        # scripts/check_doc_counts.py.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before || github.sha }}
        run: python scripts/check_doc_counts.py --release-if-version-raised "$BASE"

      - name: Check limitations.json loads and the Bugs headings survive
        run: python scripts/check_limitations_sync.py

      - name: Lint (ruff)
        run: ruff check .

      - name: Security lint (ruff S rules)
        run: ruff check --select S vera/

      - name: Hygiene hooks (pre-commit-hooks) on every file
        # The local hook runs these on the files a commit stages; here they
        # cover every file, so a commit that skipped the hook is still held
        # to them.  check-added-large-files stays at the commit: it inspects
        # the files a commit ADDS, which only the commit's own index records.
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-toml check-merge-conflict debug-statements; do
            pre-commit run --all-files --show-diff-on-failure "$hook"
          done

      - name: Verify uv.lock is up to date
        run: |
          pip install "uv>=0.5,<2"
          uv lock --check

  security:
    name: security
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: dependency-audit
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: pip install -e . && pip install pip-audit

      - name: Audit dependencies for known CVEs
        # --skip-editable: vera itself is a local editable install, not on PyPI
        run: pip-audit --skip-editable

  wheel-preflight:
    name: wheel-preflight
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    # Structural backstop for #691-class regressions: if an upstream dep
    # bumps its platform-tag baseline (e.g. z3-solver going from
    # macosx_13_0_arm64 to macosx_15_0_arm64 between 4.15.4 and 4.15.5),
    # this job fails fast in CI rather than letting users discover the
    # regression at install time on their machine.  Pairs with the
    # README §Supported platforms policy; the script enforces what the
    # README documents.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check wheel availability across supported platforms
        run: python scripts/check_wheel_availability.py

  package-distribution:
    name: package-distribution
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    # Build the exact artifacts that will eventually be uploaded under
    # the `veralang` distribution name (#737).  This stays separate from
    # release automation (#481): PR CI validates artifacts but publishes
    # nothing.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: pip install build twine

      - name: Build and inspect distribution archives
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py dist

      - name: Install and smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/veralang-wheel-smoke"
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/python" -m pip install dist/*.whl
          cp examples/hello_world.vera "$RUNNER_TEMP/hello_world.vera"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" version
          "$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" check hello_world.vera
          run_out="$("$RUNNER_TEMP/veralang-wheel-smoke/bin/vera" run hello_world.vera)"
          printf '%s\n' "$run_out"
          case "$run_out" in
            *"Hello, World!"*) ;;
            *) echo "::error::wheel smoke: unexpected 'vera run' output"; exit 1 ;;
          esac

  sbom:
    name: sbom
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # Generate an SBOM on the push event every merged pull request produces
    # on main.  PRs get the artifact too, useful for reviewing dependency
    # changes.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install vera and CycloneDX tooling
        run: pip install -e . && pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --of JSON -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  eager-gc:
    name: eager-gc
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    # #1379/#1382: `VERA_EAGER_GC=1` forces a collection at every `$alloc`,
    # which turns a rooting bug from a timing accident into a deterministic
    # failure (ENVIRONMENT.md).  Both defects this lane would have caught
    # were found by hand; without the lane the class re-enters silently,
    # because the ordinary run is green on exactly the programs that fail
    # here.  Its own job rather than a step on `test`: it re-runs every
    # run-level conformance program and every runnable example under a knob
    # that makes them slower, and a failure here should name itself rather
    # than arrive as a line inside the main suite's output.  Both go through
    # the suite's own tests, in one pytest run: the conformance programs'
    # run stage (`test_run`) and the examples' runs (TestRealExamples).  A
    # collection changes what a program does only when it runs, so the
    # parse, check and verify stages are not repeated here.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Conformance and example runs under eager GC
        run: pytest tests/test_conformance.py tests/test_check_examples_run.py::TestRealExamples -k run -n auto
        env:
          VERA_EAGER_GC: "1"

  browser-parity:
    name: browser-parity
    needs: plan
    if: needs.plan.outputs.inert != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run browser parity tests
        run: pytest tests/test_browser.py -v
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      - name: Generate JS coverage report
        if: always()
        run: npx c8 report --temp-directory="$RUNNER_TEMP/v8-coverage" --reporter=lcov --report-dir=./js-coverage --src=vera/browser/

      - name: Upload JS coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: js-coverage/lcov.info
          flags: javascript
          fail_ci_if_error: false
