# Pre-commit hooks — run `pre-commit install` after cloning.
# See https://pre-commit.com for more information.
#
# Local hooks use `language: system` and assume the venv is active
# (the same environment where `pip install -e ".[dev]"` was run).

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: debug-statements

  # Project-specific checks — require activated venv
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy vera/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false

      - id: conformance-suite
        name: conformance suite
        entry: .venv/bin/python scripts/check_conformance.py
        language: system
        pass_filenames: false
        files: '(tests/conformance/.*|vera/.*\.py$|vera/grammar\.lark$)'

      - id: conformance-suite-eager-gc
        name: conformance suite (eager GC)
        entry: env VERA_EAGER_GC=1 .venv/bin/python scripts/check_conformance.py
        language: system
        pass_filenames: false
        files: '(tests/conformance/.*|vera/.*\.py$|vera/grammar\.lark$)'

      - id: vera-examples
        name: vera examples
        entry: .venv/bin/python scripts/check_examples.py
        language: system
        pass_filenames: false
        files: '(\.vera$|vera/.*\.py$|vera/grammar\.lark$)'

      - id: corpus-canonical
        name: corpus canonical form
        entry: .venv/bin/python scripts/check_corpus_canonical.py
        language: system
        pass_filenames: false
        # Canonical form is a product of the whole front end, not just
        # the formatter: this PR changed it from `vera/transform.py` and
        # `vera/ast.py` (a new `where_span`), neither of which a
        # formatter-only pattern matches.  Match all Python under
        # `vera/` (same reasoning as walker-coverage and
        # diagnostic-fields) so no input to `vera fmt` can change
        # without re-running the gate.
        files: '(\.vera$|vera/.*\.py$|vera/grammar\.lark$|scripts/check_corpus_canonical\.py$)'

      - id: examples-readme
        name: examples readme
        entry: .venv/bin/python scripts/check_examples_readme.py
        language: system
        pass_filenames: false
        files: '(examples/README\.md$|examples/.*\.vera$)'

      # The seven doc-block gates below read the inline vera:skip fence
      # annotations via scripts/doc_annotations.py (#538), so an edit to
      # that shared module (or the gate script itself) re-runs the gate.
      - id: readme-examples
        name: readme examples
        entry: .venv/bin/python scripts/check_readme_examples.py
        language: system
        pass_filenames: false
        files: '(README\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_readme_examples|doc_annotations)\.py$)'

      - id: examples-doc
        name: examples doc
        entry: .venv/bin/python scripts/check_examples_doc.py
        language: system
        pass_filenames: false
        files: '(EXAMPLES\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_examples_doc|doc_annotations)\.py$)'

      - id: skill-examples
        name: skill examples
        entry: .venv/bin/python scripts/check_skill_examples.py
        language: system
        pass_filenames: false
        files: '(SKILL\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_skill_examples|doc_annotations)\.py$)'

      - id: faq-examples
        name: faq examples
        entry: .venv/bin/python scripts/check_faq_examples.py
        language: system
        pass_filenames: false
        files: '(FAQ\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_faq_examples|doc_annotations)\.py$)'

      - id: debruijn-examples
        name: de bruijn examples
        entry: .venv/bin/python scripts/check_debruijn_examples.py
        language: system
        pass_filenames: false
        files: '(DE_BRUIJN\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_debruijn_examples|doc_annotations)\.py$)'

      - id: diagnostic-examples
        name: diagnostic examples
        entry: .venv/bin/python scripts/check_diagnostic_examples.py
        language: system
        pass_filenames: false
        files: '(DE_BRUIJN\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_diagnostic_examples|doc_annotations)\.py$)'

      - id: pypi-readme-examples
        name: pypi readme examples
        entry: .venv/bin/python scripts/check_pypi_readme_examples.py
        language: system
        pass_filenames: false
        files: '(PYPI_README\.md$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_pypi_readme_examples|check_html_examples|doc_annotations)\.py$)'

      - id: html-examples
        name: html examples
        entry: .venv/bin/python scripts/check_html_examples.py
        language: system
        pass_filenames: false
        files: '(docs/index\.html$|vera/.*\.py$|vera/grammar\.lark$|scripts/(check_html_examples|doc_annotations)\.py$)'

      # #819 — fails when a doc example *defines* a function named after an
      # opaque built-in (which `vera check` rejects with E151).  The other doc
      # validators only parse, so such examples would otherwise slip through.
      - id: doc-builtin-shadowing
        name: doc builtin shadowing
        entry: .venv/bin/python scripts/check_doc_builtin_shadowing.py
        language: system
        pass_filenames: false
        files: '(\.md$|vera/environment\.py$|vera/prelude\.py$)'

      # #683 — fails when a rule name exists in spec/10-grammar.md's EBNF but
      # not in vera/grammar.lark, or the other way round.  Chapter 10 is the
      # published map of the parse tree and drifted from it: the spec still
      # called the assertion forms assert_stmt/assume_stmt after they became
      # expressions, and three Lark rules (pure_effect, effect_set,
      # with_clause) appeared in no EBNF block at all.  Rule names only — the
      # bodies are not compared.
      - id: grammar-alignment
        name: grammar rule-name alignment
        entry: .venv/bin/python scripts/check_grammar_alignment.py
        language: system
        pass_filenames: false
        files: '(vera/grammar\.lark$|spec/10-grammar\.md$|scripts/check_grammar_alignment\.py$)'

      # #1156 — fails when an editor grammar under editors/, or one of the two
      # extension READMEs that repeat the list in prose, omits a built-in
      # effect name.  Both enumerate them by hand and drifted four effects
      # behind the registry silently (an unknown capitalised name just falls
      # through to the generic type rule), so nothing failed when adding an
      # effect skipped them.  Triggered by the effect registry as well as
      # the grammars, since a new effect is what puts them out of date.
      - id: editor-grammars
        name: editor grammars
        entry: .venv/bin/python scripts/check_editor_grammars.py
        language: system
        pass_filenames: false
        files: '(editors/.*|vera/environment\.py$|vera/introspect\.py$|scripts/check_editor_grammars\.py$)'

      # Layer 1 of #626 — fails when any compile of an example or
      # conformance program emits [E602] (body unsupported) or
      # [E604] (param unsupported) outside the explicit allowlist
      # in scripts/check_e602_clean.py.  The warning channel was
      # the project's only signal for silent translator-skip
      # failures; this hook turns it into a gating check so new
      # silent skips can't merge undetected.
      - id: e602-clean
        name: no unexpected E602/E604 skips
        entry: .venv/bin/python scripts/check_e602_clean.py
        language: system
        pass_filenames: false
        files: '(examples/.*\.vera$|tests/conformance/.*\.vera$|vera/.*\.py$|vera/grammar\.lark$|vera/prelude\.py$|scripts/check_e602_clean\.py$)'

      # The examples RUN.  check_examples.py checks + verifies them and
      # the e602 gate above compiles them; none of that executes one, so
      # an example could trap at run time and stay green.  The gate runs
      # every example it can drive and requires the rest to carry a
      # documented skip property, so a new example cannot be added
      # without classifying it.  Also cross-checks TESTING.md's
      # execution-model table against the script's own classification.
      - id: examples-run
        name: examples run trap-free
        entry: .venv/bin/python scripts/check_examples_run.py
        language: system
        pass_filenames: false
        files: '(examples/.*\.vera$|examples/sqlitedb\.sqlite$|vera/.*\.py$|vera/grammar\.lark$|TESTING\.md$|scripts/check_examples_run\.py$)'

      - id: doc-counts
        name: doc counts
        entry: .venv/bin/python scripts/check_doc_counts.py
        language: system
        pass_filenames: false
        files: '(README\.md$|vera/README\.md$|TESTING\.md$|CONTRIBUTING\.md$|CLAUDE\.md$|KNOWN_ISSUES\.md$|HISTORY\.md$|ROADMAP\.md$|docs/index\.html$|tests/test_.*\.py$|tests/conformance/manifest\.json$|examples/.*\.vera$|vera/codegen/api\.py$|scripts/check_doc_counts\.py$|\.pre-commit-config\.yaml$|\.github/workflows/ci\.yml$)'

      - id: walker-coverage
        name: walker coverage
        entry: .venv/bin/python scripts/check_walker_coverage.py
        language: system
        pass_filenames: false
        # Match all Python under `vera/` plus the script itself.
        # The script's auto-discovery globs `vera/**/*.py` for
        # walkers carrying the `WALKER_COVERAGE:` marker, so the
        # hook's trigger must be at least as broad — otherwise a
        # new walker file landing outside the previously-listed
        # subpaths (e.g. `vera/transform.py`, `vera/parser/foo.py`)
        # would be auto-discovered by the script but edits to it
        # wouldn't trigger the hook, replicating the registry-
        # drift silent-skip class this PR is meant to close.
        files: '(vera/.*\.py$|scripts/check_walker_coverage\.py$)'

      - id: diagnostic-fields
        name: diagnostic fields
        entry: .venv/bin/python scripts/check_diagnostic_fields.py
        language: system
        pass_filenames: false
        # The script auto-discovers every Diagnostic(...) constructor and
        # _error/_warning call under `vera/**/*.py`, so the trigger must be
        # at least as broad as that glob (same reasoning as walker-coverage).
        # It ALSO validates each spec_ref against the section/chapter titles in
        # `spec/**/*.md`, so a spec-only retitle can invalidate an unchanged
        # citation — include spec markdown so that edit re-runs the check too.
        files: '(vera/.*\.py$|spec/.*\.md$|scripts/check_diagnostic_fields\.py$)'

      - id: explicit-encoding
        name: explicit encoding
        entry: .venv/bin/python scripts/check_explicit_encoding.py
        language: system
        pass_filenames: false
        # Auto-discovers every text-mode open()/read_text()/write_text() under
        # vera/, scripts/, tests/ (#645), so the trigger must be at least that
        # broad (same reasoning as diagnostic-fields / walker-coverage).
        files: '((vera|scripts|tests)/.*\.py$)'

      - id: limitations-sync
        name: limitations sync
        entry: .venv/bin/python scripts/check_limitations_sync.py
        language: system
        pass_filenames: false
        files: '(KNOWN_ISSUES\.md$|vera/README\.md$|SKILL\.md$|LSP_SERVER\.md$|spec/0[89]-.*\.md$|spec/1[12]-.*\.md$|scripts/check_limitations_sync\.py$)'

      - id: license-check
        name: license check
        entry: .venv/bin/python scripts/check_licenses.py
        language: system
        pass_filenames: false
        files: 'pyproject\.toml$'

      - id: site-assets
        name: site assets
        entry: .venv/bin/python scripts/build_site.py
        language: system
        pass_filenames: false
        files: '(SKILL\.md$|AGENTS\.md$|FAQ\.md$|LSP_SERVER\.md$|vera/__init__\.py$|vera/errors\.py$|vera/grammar\.lark$|docs/index\.html$|scripts/(build_site|doc_annotations)\.py$)'

      - id: browser-parity
        name: browser parity
        entry: .venv/bin/pytest tests/test_browser.py -q
        language: system
        pass_filenames: false
        files: '(vera/browser/.*|vera/codegen/api\.py$|vera/wasm/markdown\.py$|vera/markdown\.py$)'

      # Pre-push stage: runs once before `git push`, not per-commit.
      # Checks that PRs touching substantive code (vera/, spec/, SKILL.md)
      # also include a new CHANGELOG entry.  Escape hatches: a
      # "Skip-changelog: <reason>" trailer in any commit on the branch,
      # or SKIP_CHANGELOG_LABEL=1 in the environment (used by CI when a
      # skip-changelog PR label has been detected).
      - id: check-changelog-updated
        name: check CHANGELOG updated for substantive changes
        entry: .venv/bin/python scripts/check_changelog_updated.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      # Pre-push stage: catches stale uv.lock locally instead of in CI.
      # CI runs `uv lock --check` in the lint job; if it fails after a
      # push, you pay ~2 minutes of CI time plus an amend+force-push.
      # Version bumps in pyproject.toml are the common trigger — the
      # lockfile gains a new `version = "..."` line for the project
      # package and `uv lock --check` fails.  Running the same check
      # pre-push catches it before the push goes out.  Costs well
      # under a second when the lockfile is fresh.  Added after the
      # v0.0.114 bump on #491 tripped CI lint — issue #463's review
      # cycle included this as a hygiene bump.
      - id: uv-lock-check
        name: check uv.lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
