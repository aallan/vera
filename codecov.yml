# Codecov reports through commit statuses, not check runs.  A check run is
# created in progress and completed by a second call, and that second call
# went missing on about one pull-request commit in eight (12 of 98 commits
# of #1826 to #1859, measured on 12 November 2026), leaving one of the four
# checks "in progress" for good: the pull request shows a pending check
# that never ends, and anything that waits for every check to finish
# (`gh pr checks --watch`) never returns.  A status is posted whole.
github_checks: false

coverage:
  status:
    project:
      python:
        target: auto
        # Allow up to 0.5% drop to accommodate defensive error paths that
        # cannot be triggered from normal test code (e.g. "module has no
        # alloc export" checks that the compiler always satisfies).
        threshold: 0.5%
        flags:
          - python
      javascript:
        target: auto
        flags:
          - javascript
        informational: true
    patch:
      python:
        # Python coverage.py does not mark multi-line expression continuation
        # lines as executable, so they are absent from coverage.xml.  Codecov
        # counts every '+' diff line — including those continuation lines — as
        # needing coverage, which systematically deflates patch percentages for
        # any PR that reformats code into multi-line calls.  The project-level
        # check (95%+) is the real coverage gate; patch is informational only.
        target: auto
        informational: true
        flags:
          - python
      javascript:
        target: auto
        flags:
          - javascript
        informational: true

flags:
  python:
    paths:
      - vera/
    carryforward: true
  javascript:
    paths:
      - vera/browser/
    carryforward: true
