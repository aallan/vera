<svg width="920" height="380" viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Contract-driven testing: Z3 reads each function's requires clause and generates concrete inputs that satisfy it, each input is compiled to WASM and executed with real values, and the ensures postcondition is checked against the actual output — any violation fails the test with the concrete input that triggered it.</title>
  <!-- Design system: see architecture.svg. Grounded in FAQ §contract-driven testing / vera test. -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .t { font-size: 12px; font-weight: 600; fill: #2d2b28; }
      .d { font-size: 10.5px; fill: #7a756d; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .lbl { font-size: 10px; font-weight: 600; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="377" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="42">vera test · CONTRACT-DRIVEN TESTING</text>
  <text class="f sub" x="36" y="64">No hand-written cases: the contracts are both the specification the compiler proves and the test oracle.</text>

  <!-- step 1 -->
  <g>
    <rect class="card" x="36" y="92" width="268" height="94" rx="10"/>
    <rect x="36.5" y="92.5" width="4" height="93" rx="2" fill="#d4952a"/>
    <text class="f micro" x="54" y="114" letter-spacing="1">1 · GENERATE</text>
    <text class="f t" x="54" y="134">Z3 reads requires(…)</text>
    <text class="f d" x="54" y="152">and produces concrete inputs that satisfy</text>
    <text class="f d" x="54" y="166">it — <tspan class="m" font-size="10px">@Int.1 != 0</tspan> yields pairs with a</text>
    <text class="f d" x="54" y="180">non-zero second value</text>
  </g>
  <line class="edge" x1="304" y1="139" x2="342" y2="139" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <g>
    <rect class="card" x="346" y="92" width="248" height="94" rx="10"/>
    <rect x="346.5" y="92.5" width="4" height="93" rx="2" fill="#5a9e6f"/>
    <text class="f micro" x="364" y="114" letter-spacing="1">2 · EXECUTE</text>
    <text class="f t" x="364" y="134">real runs, not symbols</text>
    <text class="f d" x="364" y="152">each input is compiled to WASM and</text>
    <text class="f d" x="364" y="166">executed via wasmtime — up to</text>
    <text class="f d" x="364" y="180"><tspan class="m" font-size="10px">--trials</tspan> per function (default 100)</text>
  </g>
  <line class="edge" x1="594" y1="139" x2="632" y2="139" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <g>
    <rect class="card" x="636" y="92" width="248" height="94" rx="10"/>
    <rect x="636.5" y="92.5" width="4" height="93" rx="2" fill="#8b6cad"/>
    <text class="f micro" x="654" y="114" letter-spacing="1">3 · CHECK</text>
    <text class="f t" x="654" y="134">ensures(…) is the oracle</text>
    <text class="f d" x="654" y="152">the postcondition is evaluated against</text>
    <text class="f d" x="654" y="166">the actual output of every trial</text>
  </g>

  <!-- outcomes -->
  <polyline class="edge" points="700,186 700,222 636,222" marker-end="url(#arr)"/>
  <text class="m lbl" x="712" y="212" fill="#a83838">violated</text>
  <g>
    <rect class="card" x="360" y="200" width="272" height="44" rx="10"/>
    <rect x="360.5" y="200.5" width="4" height="43" rx="2" fill="#c45"/>
    <text class="f t" x="378" y="220" fill="#a83838">FAIL — with the concrete input</text>
    <text class="f d" x="378" y="236">the exact values that broke the contract</text>
  </g>
  <polyline class="edge" points="820,186 820,222 756,222" marker-end="url(#arr)"/>
  <text class="m lbl" x="832" y="212" fill="#3d7a4d">held</text>
  <g>
    <rect class="card" x="656" y="200" width="98" height="44" rx="10"/>
    <rect x="656.5" y="200.5" width="4" height="43" rx="2" fill="#5a9e6f"/>
    <text class="f t" x="674" y="226" fill="#3d7a4d">PASS</text>
  </g>

  <!-- the point -->
  <g>
    <rect class="card" x="36" y="268" width="848" height="52" rx="10"/>
    <rect x="36.5" y="268.5" width="4" height="51" rx="2" fill="#cc9966"/>
    <text class="f d" x="54" y="290">The best of property-based testing — generated inputs, no manual cases — with the best of formal verification:</text>
    <text class="f d" x="54" y="306">inputs derived from the <tspan font-weight="600">specification</tspan>, not from randomness alone.</text>
  </g>

  <!-- footer -->
  <text class="f footi" x="36" y="352">vera test file.vera · --trials 50 to bound work · --json for agents.</text>
</svg>
