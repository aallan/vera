    <text class="f lbl" x="270" y="108">CONFORMANCE PROGRAMS</text>
    <text class="f val" x="270" y="130">273</text>
    <text class="f from" x="432" y="130" text-anchor="end">from 0</text>
    <polygon points="270,186 284.7,186 299.5,186 314.2,175.7 328.9,171.7 343.6,169.4 358.4,169.2 373.1,169.2 387.8,163 402.5,159.7 417.3,144.7 432,142 432,186" fill="#ede8f2"/>
    <polyline points="270,186 284.7,186 299.5,186 314.2,175.7 328.9,171.7 343.6,169.4 358.4,169.2 373.1,169.2 387.8,163 402.5,159.7 417.3,144.7 432,142" fill="none" stroke="#8b6cad" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="432" cy="142" r="2.5" fill="#8b6cad"/>
    <text class="m axis" x="270" y="212">v0.0.1</text>
    <text class="m axis" x="432" y="212" text-anchor="end">v0.2.7</text>
  </g>

