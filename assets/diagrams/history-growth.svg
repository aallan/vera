<svg width="920" height="288" viewBox="0 0 920 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Growth across the twelve landmark releases, 23 February to 9 November 2026: tests from about fifty to 55,671; conformance programs from zero to 273; examples from thirteen to 44; built-in functions from zero to 168.</title>
  <!-- Design system: see architecture.svg. Data: HISTORY.md §By the numbers, as recorded at v0.2.8.
       Each series is scaled to its own maximum.
       Series (12 columns): tests 50,300,1400,3095,4342,5559,5615,5808,6779,7992,30095,55671 · conformance 0,0,0,64,89,103,104,104,143,163,256,273
       examples 13,15,18,30,35,35,36,36,37,39,43,44 · builtins 0,0,30,122,164,164,164,164,164,164,164,168 -->
  <defs>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .lbl { font-size: 10px; font-weight: 600; letter-spacing: 1px; fill: #a9a49b; }
      .val { font-size: 17px; font-weight: 600; fill: #2d2b28; font-variant-numeric: tabular-nums; }
      .from { font-size: 10px; fill: #a9a49b; }
      .axis { font-size: 9px; fill: #a9a49b; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="285" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="40">BY THE NUMBERS · TWELVE RELEASES</text>
  <text class="f sub" x="36" y="62">23 Feb → 9 Nov 2026, as recorded in HISTORY.md at v0.2.8</text>

  <!-- tests -->
  <g>
    <rect class="card" x="36" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="52" y="108">TESTS</text>
    <text class="f val" x="52" y="130">55,671</text>
    <text class="f from" x="214" y="130" text-anchor="end">from ~50</text>
    <polygon points="52,186 66.7,185.8 81.5,184.9 96.2,183.6 110.9,182.6 125.6,181.6 140.4,181.6 155.1,181.4 169.8,180.6 184.5,179.7 199.3,162.2 214,142 214,186 52,186" fill="#f8efdf"/>
    <polyline points="52,186 66.7,185.8 81.5,184.9 96.2,183.6 110.9,182.6 125.6,181.6 140.4,181.6 155.1,181.4 169.8,180.6 184.5,179.7 199.3,162.2 214,142" fill="none" stroke="#d4952a" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="214" cy="142" r="2.5" fill="#d4952a"/>
    <text class="m axis" x="52" y="212">v0.0.1</text>
    <text class="m axis" x="214" y="212" text-anchor="end">v0.2.7</text>
  </g>

