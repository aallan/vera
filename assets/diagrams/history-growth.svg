<svg width="920" height="272" viewBox="0 0 920 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Growth across the nine landmark releases, 23 February to 4 July 2026: tests from about fifty to 6,779; conformance programs from zero to 143; examples from thirteen to 37; built-in functions from zero to 164.</title>
  <!-- Design system: see architecture.svg. Data: HISTORY.md §By the numbers, as recorded at v0.1.0.
       Series (9 columns): tests 50,300,1400,3095,4342,5559,5615,5808,6821 · conformance 0,0,0,64,89,103,104,104,143
       examples 13,15,18,30,35,35,36,36,37 · builtins 0,0,30,122,164,164,164,164,164 -->
  <defs>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .lbl { font-size: 10px; font-weight: 600; letter-spacing: 1px; fill: #a9a49b; }
      .val { font-size: 17px; font-weight: 600; fill: #2d2b28; font-variant-numeric: tabular-nums; }
      .from { font-size: 10px; fill: #a9a49b; }
      .axis { font-size: 9px; fill: #a9a49b; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="269" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="40">BY THE NUMBERS · NINE RELEASES</text>
  <text class="f sub" x="36" y="62">23 Feb → 4 Jul 2026, as recorded in HISTORY.md at v0.1.0</text>

  <!-- tests -->
  <g>
    <rect class="card" x="36" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="52" y="108">TESTS</text>
    <text class="f val" x="52" y="130">6,779</text>
    <text class="f from" x="214" y="130" text-anchor="end">from ~50</text>
    <polygon points="52,186 72,184 93,177 113,166 133,158 154,150 174,150 194,149 214,142 214,186" fill="#f8efdf"/>
    <polyline points="52,186 72,184 93,177 113,166 133,158 154,150 174,150 194,149 214,142" fill="none" stroke="#d4952a" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="214" cy="142" r="2.5" fill="#d4952a"/>
    <text class="m axis" x="52" y="212">v0.0.1</text>
    <text class="m axis" x="214" y="212" text-anchor="end">v0.1.0</text>
  </g>

  <!-- conformance -->
  <g>
    <rect class="card" x="254" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="270" y="108">CONFORMANCE PROGRAMS</text>
    <text class="f val" x="270" y="130">143</text>
    <text class="f from" x="432" y="130" text-anchor="end">from 0</text>
    <polygon points="270,186 290,186 311,186 331,166 351,159 372,154 392,154 412,154 432,142 432,186" fill="#ede8f2"/>
    <polyline points="270,186 290,186 311,186 331,166 351,159 372,154 392,154 412,154 432,142" fill="none" stroke="#8b6cad" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="432" cy="142" r="2.5" fill="#8b6cad"/>
    <text class="m axis" x="270" y="212">v0.0.1</text>
    <text class="m axis" x="432" y="212" text-anchor="end">v0.1.0</text>
  </g>

  <!-- examples -->
  <g>
    <rect class="card" x="472" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="488" y="108">EXAMPLES</text>
    <text class="f val" x="488" y="130">37</text>
    <text class="f from" x="650" y="130" text-anchor="end">from 13</text>
    <polygon points="488,171 508,168 529,165 549,150 569,144 590,144 610,143 630,143 650,142 650,186 488,186" fill="#e6f0e9"/>
    <polyline points="488,171 508,168 529,165 549,150 569,144 590,144 610,143 630,143 650,142" fill="none" stroke="#5a9e6f" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="650" cy="142" r="2.5" fill="#5a9e6f"/>
    <text class="m axis" x="488" y="212">v0.0.1</text>
    <text class="m axis" x="650" y="212" text-anchor="end">v0.1.0</text>
  </g>

  <!-- built-ins -->
  <g>
    <rect class="card" x="690" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="706" y="108">BUILT-IN FUNCTIONS</text>
    <text class="f val" x="706" y="130">164</text>
    <text class="f from" x="868" y="130" text-anchor="end">from 0</text>
    <polygon points="706,186 726,186 747,178 767,153 787,142 808,142 828,142 848,142 868,142 868,186" fill="#e4ecf2"/>
    <polyline points="706,186 726,186 747,178 767,153 787,142 808,142 828,142 848,142 868,142" fill="none" stroke="#4a82a8" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="868" cy="142" r="2.5" fill="#4a82a8"/>
    <text class="m axis" x="706" y="212">v0.0.1</text>
    <text class="m axis" x="868" y="212" text-anchor="end">v0.1.0</text>
  </g>

  <!-- footer -->
  <text class="f footi" x="36" y="248">Nine releases chosen for the capability each unlocked, not even spacing —</text>
  <text class="f footi" x="36" y="264">first release → runs end-to-end → GC → Inference → LSP → soundness → HttpServer → WASI serve → zero known bugs.</text>
</svg>
