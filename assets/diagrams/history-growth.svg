    <polygon points="488,173 502.7,171 517.5,168 532.2,156 546.9,151 561.6,151 576.4,150 591.1,150 605.8,149 620.5,147 635.3,143 650,142 650,186 488,186" fill="#e6f0e9"/>
    <polyline points="488,173 502.7,171 517.5,168 532.2,156 546.9,151 561.6,151 576.4,150 591.1,150 605.8,149 620.5,147 635.3,143 650,142" fill="none" stroke="#5a9e6f" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="650" cy="142" r="2.5" fill="#5a9e6f"/>
    <text class="m axis" x="488" y="212">v0.0.1</text>
    <text class="m axis" x="650" y="212" text-anchor="end">v0.2.7</text>
  </g>

  <!-- built-ins -->
  <g>
    <rect class="card" x="690" y="84" width="194" height="140" rx="10"/>
    <text class="f lbl" x="706" y="108">BUILT-IN FUNCTIONS</text>
    <text class="f val" x="706" y="130">168</text>
    <text class="f from" x="868" y="130" text-anchor="end">from 0</text>
    <polygon points="706,186 720.7,186 735.5,178.1 750.2,154 764.9,143 779.6,143 794.4,143 809.1,143 823.8,143 838.5,143 853.3,143 868,142 868,186" fill="#e4ecf2"/>
    <polyline points="706,186 720.7,186 735.5,178.1 750.2,154 764.9,143 779.6,143 794.4,143 809.1,143 823.8,143 838.5,143 853.3,143 868,142" fill="none" stroke="#4a82a8" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="868" cy="142" r="2.5" fill="#4a82a8"/>
    <text class="m axis" x="706" y="212">v0.0.1</text>
    <text class="m axis" x="868" y="212" text-anchor="end">v0.2.7</text>
  </g>

  <!-- footer -->
  <text class="f footi" x="36" y="248">Twelve releases, chosen for the capability each unlocked rather than for even spacing:</text>
  <text class="f footi" x="36" y="264">first release → runs end-to-end → GC → Inference → LSP → soundness campaign → HttpServer → WASI serve →</text>
  <text class="f footi" x="36" y="280">zero known bugs → first PyPI release → soundness release → one obligation table.</text>
</svg>
