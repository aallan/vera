<svg width="920" height="548" viewBox="0 0 920 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">The agent proof-delta loop: didOpen returns diagnostics and tier hints; vera/speculativeEdit verifies a draft in memory against the warm session and returns a proof delta without touching the document; vera/proposeEdit re-verifies from the warm cache and applies only if nothing newly fails to prove.</title>
  <!-- Design system: see architecture.svg. Grounded in LSP_SERVER.md. -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .t { font-size: 13px; font-weight: 600; fill: #2d2b28; }
      .d { font-size: 10px; fill: #7a756d; }
      .life { stroke: #d9d6d0; stroke-width: 1; stroke-dasharray: 3 3; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .ret { fill: none; stroke: #a9a49b; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .msg { font-size: 11px; font-weight: 600; fill: #2d2b28; }
      .note { font-size: 10px; font-style: italic; fill: #a9a49b; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="545" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="42">LANGUAGE SERVER · THE AGENT PROOF-DELTA LOOP</text>
  <text class="f sub" x="36" y="64">Four custom methods let an agent ask “does this edit still prove?” without round-tripping through <tspan class="m" font-size="10.5px">vera verify</tspan>.</text>

  <!-- lane headers -->
  <g>
    <rect class="card" x="60" y="84" width="180" height="40" rx="10"/>
    <rect x="60.5" y="84.5" width="4" height="39" rx="2" fill="#4a82a8"/>
    <text class="f t" x="150" y="109" text-anchor="middle">coding agent</text>
  </g>
  <g>
    <rect class="card" x="360" y="84" width="220" height="40" rx="10"/>
    <rect x="360.5" y="84.5" width="4" height="39" rx="2" fill="#d4952a"/>
    <text class="f t" x="470" y="102" text-anchor="middle">vera lsp</text>
    <text class="m" x="470" y="117" text-anchor="middle" font-size="9.5px" fill="#7a756d">warm VerificationSession</text>
  </g>
  <g>
    <rect class="card" x="700" y="84" width="160" height="40" rx="10"/>
    <rect x="700.5" y="84.5" width="4" height="39" rx="2" fill="#d4952a"/>
    <text class="f t" x="780" y="109" text-anchor="middle">Z3</text>
  </g>

  <line class="life" x1="150" y1="124" x2="150" y2="470"/>
  <line class="life" x1="470" y1="124" x2="470" y2="470"/>
  <line class="life" x1="780" y1="124" x2="780" y2="470"/>

  <!-- 1 · didOpen -->
  <line class="edge" x1="156" y1="156" x2="458" y2="156" marker-end="url(#arr)"/>
  <text class="m msg" x="300" y="147" text-anchor="middle">didOpen(main.vera)</text>
  <line class="edge" x1="476" y1="172" x2="768" y2="172" marker-end="url(#arr)"/>
  <text class="f note" x="620" y="164" text-anchor="middle">full pass — every obligation, cached by structural hash</text>
  <line class="ret" x1="464" y1="196" x2="162" y2="196"/>
  <text class="f note" x="300" y="188" text-anchor="middle">diagnostics + per-function tier hints</text>

  <!-- 2 · speculativeEdit -->
  <line class="edge" x1="156" y1="240" x2="458" y2="240" marker-end="url(#arr)"/>
  <text class="m msg" x="300" y="231" text-anchor="middle">vera/speculativeEdit</text>
  <text class="f note" x="300" y="254" text-anchor="middle">full proposed source, verified in memory</text>
  <line class="edge" x1="476" y1="270" x2="768" y2="270" marker-end="url(#arr)"/>
  <text class="f note" x="620" y="262" text-anchor="middle">re-prove only what the edit could break</text>
  <line class="ret" x1="464" y1="298" x2="162" y2="298"/>
  <text class="m" x="300" y="290" text-anchor="middle" font-size="10.5px" fill="#b07820">proof delta: newly_discharged · newly_undischarged · unchanged</text>
  <text class="f note" x="300" y="312" text-anchor="middle">the canonical document is untouched</text>

  <!-- 3 · proposeEdit -->
  <line class="edge" x1="156" y1="356" x2="458" y2="356" marker-end="url(#arr)"/>
  <text class="m msg" x="300" y="347" text-anchor="middle">vera/proposeEdit</text>
  <g>
    <rect class="card" x="384" y="372" width="224" height="40" rx="10"/>
    <rect x="384.5" y="372.5" width="4" height="39" rx="2" fill="#5a9e6f"/>
    <text class="f" x="400" y="389" font-size="10.5px" fill="#2d2b28" font-weight="600">the gate</text>
    <text class="f d" x="400" y="404">apply iff no new failures, no errors</text>
  </g>
  <line class="ret" x1="464" y1="440" x2="162" y2="440"/>
  <text class="f note" x="300" y="432" text-anchor="middle">applied — or refused, with the delta that says why</text>

  <!-- invalidation card -->
  <g>
    <rect class="card" x="620" y="330" width="264" height="96" rx="10"/>
    <rect x="620.5" y="330.5" width="4" height="95" rx="2" fill="#8b6cad"/>
    <text class="f" x="636" y="352" font-size="11px" font-weight="600" fill="#2d2b28">warm-core invalidation</text>
    <text class="f d" x="636" y="370">edit a <tspan font-weight="600">body</tspan> → re-verify that function</text>
    <text class="f d" x="636" y="386">edit a <tspan font-weight="600">contract</tspan> → also every caller</text>
    <text class="f d" x="636" y="402">timeouts are never cached</text>
    <text class="f d" x="636" y="418" font-style="italic" fill="#a9a49b">cost ∝ what the edit could have broken</text>
  </g>

  <!-- footer -->
  <text class="f footi" x="36" y="500">The structured refactors — vera/strengthenContract, vera/addEffect — construct the candidate server-side, then run the same gate.</text>
  <text class="f footi" x="36" y="520">Malformed requests refuse with standard JSON-RPC InvalidParams, never opaque errors.</text>
</svg>
