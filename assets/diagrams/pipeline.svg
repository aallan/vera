<svg width="920" height="580" viewBox="0 0 920 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">The compilation pipeline: source is parsed to a Lark parse tree, transformed to a typed AST, resolved into its module closure with every call bound to its declaration, type-checked into diagnostics, and built into one typed program; from there verification classifies each obligation as Tier 1 proved or Tier 3 runtime-checked, and compilation emits WAT text plus a WASM binary, contract guards included, without reading the verifier's result.</title>
  <!-- Design system: see architecture.svg. Grounded in spec/11 §11.1 and vera/cli.py: vera compile never runs the verifier. -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .title { font-size: 13.5px; font-weight: 600; fill: #2d2b28; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .art { font-size: 11px; fill: #7a756d; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="577" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="42">COMPILATION PIPELINE</text>
  <text class="f sub" x="36" y="64">Each stage leaves one artifact. <tspan class="m" font-size="10.5px">vera compile</tspan> skips Verify; <tspan class="m" font-size="10.5px">vera verify</tspan> also compiles, to match each Tier 3 claim to a check.</text>

  <!-- source chip -->
  <rect x="36" y="84" width="118" height="26" rx="13" fill="#f3f2ef" stroke="#e8e6e1"/>
  <text class="m" x="95" y="101" text-anchor="middle" font-size="11px" fill="#2d2b28">source.vera</text>
  <line class="edge" x1="60" y1="110" x2="60" y2="126" marker-end="url(#arr)"/>

  <!-- stages -->
  <g>
    <rect class="card" x="36" y="128" width="430" height="40" rx="10"/>
    <rect x="36.5" y="128.5" width="4" height="39" rx="2" fill="#4a82a8"/>
    <text class="f title" x="56" y="153">Parse</text>
  </g>
  <line class="edge" x1="466" y1="148" x2="496" y2="148" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="152">Lark parse tree</text>
  <line class="edge" x1="60" y1="168" x2="60" y2="184" marker-end="url(#arr)"/>

  <g>
    <rect class="card" x="36" y="186" width="430" height="40" rx="10"/>
    <rect x="36.5" y="186.5" width="4" height="39" rx="2" fill="#4a82a8"/>
    <text class="f title" x="56" y="211">Transform</text>
  </g>
  <line class="edge" x1="466" y1="206" x2="496" y2="206" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="210">typed AST</text>
  <line class="edge" x1="60" y1="226" x2="60" y2="242" marker-end="url(#arr)"/>

  <g>
    <rect class="card" x="36" y="244" width="430" height="40" rx="10"/>
    <rect x="36.5" y="244.5" width="4" height="39" rx="2" fill="#4a82a8"/>
    <text class="f title" x="56" y="269">Resolve</text>
  </g>
  <line class="edge" x1="466" y1="264" x2="496" y2="264" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="268">module closure · each call bound to its declaration</text>
  <line class="edge" x1="60" y1="284" x2="60" y2="300" marker-end="url(#arr)"/>

  <g>
    <rect class="card" x="36" y="302" width="430" height="40" rx="10"/>
    <rect x="36.5" y="302.5" width="4" height="39" rx="2" fill="#8b6cad"/>
    <text class="f title" x="56" y="327">Type Check</text>
  </g>
  <line class="edge" x1="466" y1="322" x2="496" y2="322" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="326">list[Diagnostic], every error in one pass</text>
  <line class="edge" x1="60" y1="342" x2="60" y2="358" marker-end="url(#arr)"/>

  <g>
    <rect class="card" x="36" y="360" width="430" height="40" rx="10"/>
    <rect x="36.5" y="360.5" width="4" height="39" rx="2" fill="#8b6cad"/>
    <text class="f title" x="56" y="385">Typed program</text>
  </g>
  <line class="edge" x1="466" y1="380" x2="496" y2="380" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="384">instances, clones and obligation sites, each built once</text>

  <!-- fork: Verify branches off; the spine bypasses it to Compile -->
  <line class="edge" x1="104" y1="400" x2="104" y2="416" marker-end="url(#arr)"/>
  <line class="edge" x1="56" y1="400" x2="56" y2="474" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="76" y="418" width="390" height="40" rx="10"/>
    <rect x="76.5" y="418.5" width="4" height="39" rx="2" fill="#d4952a"/>
    <text class="f title" x="96" y="443">Verify</text>
  </g>
  <line class="edge" x1="466" y1="438" x2="496" y2="438" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="442">VerifyResult: Tier 1 proved · Tier 3 runtime check</text>
  <g>
    <rect class="card" x="36" y="476" width="430" height="40" rx="10"/>
    <rect x="36.5" y="476.5" width="4" height="39" rx="2" fill="#5a9e6f"/>
    <text class="f title" x="56" y="501">Compile</text>
  </g>
  <line class="edge" x1="466" y1="496" x2="496" y2="496" marker-end="url(#arr)"/>
  <text class="m art" x="506" y="500">CompileResult: WAT text + .wasm binary</text>

  <!-- footer -->
  <text class="f footi" x="36" y="548">Verification classifies each obligation; compilation emits the module, contract guards included, either way.</text>
</svg>
