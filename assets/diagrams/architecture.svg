<svg width="920" height="760" viewBox="0 0 920 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Vera compiler architecture: the compilation pipeline from source to WebAssembly, with the verify/compile fork, the warm-verification sidecar, and the three execution targets</title>
  <!--
    Hand-authored. Design system (from the house app style):
      panel #faf9f7 / border #e8e6e1 / radius 14 · cards #fff radius 10, 4px left accent
      categories: frontend #4a82a8 · type-check #8b6cad · verify #d4952a · compile #5a9e6f · runtime #cc9966
      tints (15% over white): #e4ecf2 · #ede8f2 · #f8efdf · #e6f0e9 · #f7efe8
      text #2d2b28 / #7a756d / #a9a49b · system font stack, mono for file names
    Rules: no live counts (they drift); the check → {verify | compile} fork is deliberate —
    `vera compile` does not consume verify results; contract guards are always emitted.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .h1 { font-size: 16.5px; font-weight: 600; fill: #2d2b28; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .dash { fill: #ffffff; stroke: #cfccc5; stroke-width: 1; stroke-dasharray: 4 3; }
      .title { font-size: 14px; font-weight: 600; fill: #2d2b28; }
      .t12 { font-size: 12px; font-weight: 600; fill: #2d2b28; }
      .mod { font-size: 10.5px; fill: #7a756d; }
      .desc { font-size: 11.5px; fill: #7a756d; }
      .num { font-size: 11px; font-weight: 700; }
      .art { font-size: 11px; font-style: italic; fill: #a9a49b; }
      .pill { fill: #f3f2ef; stroke: #e8e6e1; stroke-width: 1; }
      .pillt { font-size: 10px; fill: #7a756d; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .foot { font-size: 11px; fill: #7a756d; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="1.5" y="1.5" width="917" height="757" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <!-- header -->
  <text class="f micro" x="36" y="42">VERA COMPILER · vera/</text>
  <text class="f h1" x="36" y="66">Compilation pipeline &amp; module map</text>
  <text class="f sub" x="36" y="86">Source → WebAssembly. Each stage is an independently testable module with one public entry point.</text>

  <!-- ═══ spine ═══ -->

  <!-- 1 · Parse -->
  <g>
    <rect class="card" x="36" y="108" width="520" height="58" rx="10"/>
    <rect x="36.5" y="108.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="120" width="24" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="64" y="134.5" text-anchor="middle" fill="#4a82a8">1</text>
    <text class="f title" x="86" y="135">Parse</text>
    <text class="m mod" x="540" y="134" text-anchor="end">grammar.lark · parser.py</text>
    <text class="f desc" x="86" y="154">Source text → Lark parse tree (LALR(1))</text>
  </g>
  <line class="edge" x1="64" y1="166" x2="64" y2="196" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="185">Lark parse tree</text>

  <!-- 2 · Transform -->
  <g>
    <rect class="card" x="36" y="198" width="520" height="58" rx="10"/>
    <rect x="36.5" y="198.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="210" width="24" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="64" y="224.5" text-anchor="middle" fill="#4a82a8">2</text>
    <text class="f title" x="86" y="225">Transform</text>
    <text class="m mod" x="540" y="224" text-anchor="end">transform.py · ast.py</text>
    <text class="f desc" x="86" y="244">Parse tree → typed AST</text>
  </g>
  <line class="edge" x1="64" y1="256" x2="64" y2="286" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="275">typed AST</text>

  <!-- 2b · Resolve -->
  <g>
    <rect class="card" x="36" y="288" width="520" height="58" rx="10"/>
    <rect x="36.5" y="288.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="300" width="28" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="66" y="314.5" text-anchor="middle" fill="#4a82a8">2b</text>
    <text class="f title" x="90" y="315">Resolve</text>
    <text class="m mod" x="540" y="314" text-anchor="end">resolver.py</text>
    <text class="f desc" x="90" y="334">Imports → transitive module closure · circular-import detection</text>
  </g>
  <line class="edge" x1="64" y1="346" x2="64" y2="376" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="365">AST + module closure</text>

  <!-- 3 · Type Check -->
  <g>
    <rect class="card" x="36" y="378" width="520" height="58" rx="10"/>
    <rect x="36.5" y="378.5" width="4" height="57" rx="2" fill="#8b6cad"/>
    <rect x="52" y="390" width="24" height="20" rx="6" fill="#ede8f2"/>
    <text class="f num" x="64" y="404.5" text-anchor="middle" fill="#8b6cad">3</text>
    <text class="f title" x="86" y="405">Type Check</text>
    <text class="m mod" x="540" y="404" text-anchor="end">checker/ · environment.py · types.py</text>
    <text class="f desc" x="86" y="424">Two passes: register every signature, then check bodies → list[Diagnostic]</text>
  </g>

  <!-- fork: spine continues to Compile; branch goes right to Verify -->
  <line class="edge" x1="64" y1="436" x2="64" y2="538" marker-end="url(#arr)"/>
  <rect class="pill" x="78" y="470" width="140" height="18" rx="9"/>
  <text class="m pillt" x="148" y="482.5" text-anchor="middle">vera compile · vera run</text>

  <polyline class="edge" points="500,436 500,450 590,450" marker-end="url(#arr)"/>
  <rect class="pill" x="508" y="458" width="70" height="18" rx="9"/>
  <text class="m pillt" x="543" y="470.5" text-anchor="middle">vera verify</text>

  <!-- 4 · Verify (report path, right column) -->
  <g>
    <rect class="card" x="600" y="414" width="284" height="72" rx="10"/>
    <rect x="600.5" y="414.5" width="4" height="71" rx="2" fill="#d4952a"/>
    <rect x="614" y="424" width="24" height="20" rx="6" fill="#f8efdf"/>
    <text class="f num" x="626" y="438.5" text-anchor="middle" fill="#d4952a">4</text>
    <text class="f title" x="648" y="439">Verify</text>
    <text class="m mod" x="870" y="438" text-anchor="end">verifier.py · smt.py</text>
    <text class="f desc" x="614" y="458">Z3 proves each obligation (Tier 1) or defers it (Tier 3)</text>
    <text class="m" x="614" y="475" font-size="10px" fill="#b07820">→ ok · diagnostics · Tier 1 / Tier 3 counts</text>
  </g>

  <!-- warm-verification sidecar -->
  <line x1="742" y1="486" x2="742" y2="504" stroke="#cfccc5" stroke-width="1" stroke-dasharray="3 3"/>
  <g>
    <rect class="dash" x="600" y="504" width="284" height="58" rx="10"/>
    <text class="m t12" x="614" y="524" font-size="11px">obligations/ · lsp/</text>
    <text class="f" x="614" y="540" font-size="10.5px" fill="#7a756d">Reified proof obligations · warm VerificationSession</text>
    <text class="f" x="614" y="554" font-size="10.5px" fill="#7a756d">re-proves edits — proof-delta LSP methods</text>
  </g>

  <!-- 5 · Compile -->
  <g>
    <rect class="card" x="36" y="540" width="520" height="58" rx="10"/>
    <rect x="36.5" y="540.5" width="4" height="57" rx="2" fill="#5a9e6f"/>
    <rect x="52" y="552" width="24" height="20" rx="6" fill="#e6f0e9"/>
    <text class="f num" x="64" y="566.5" text-anchor="middle" fill="#5a9e6f">5</text>
    <text class="f title" x="86" y="567">Compile</text>
    <text class="m mod" x="540" y="566" text-anchor="end">codegen/ · wasm/</text>
    <text class="f desc" x="86" y="586">Monomorphize generics · insert contract guards · emit WAT → wat2wasm</text>
  </g>
  <line class="edge" x1="64" y1="598" x2="64" y2="628" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="617">WAT + .wasm</text>

  <!-- Compile → alternate targets -->
  <polyline class="edge" points="556,569 578,569 578,600 590,600" marker-end="url(#arr)"/>
  <polyline class="edge" points="578,600 578,648 590,648" marker-end="url(#arr)"/>

  <!-- 6 · Execute -->
  <g>
    <rect class="card" x="36" y="630" width="520" height="58" rx="10"/>
    <rect x="36.5" y="630.5" width="4" height="57" rx="2" fill="#cc9966"/>
    <rect x="52" y="642" width="24" height="20" rx="6" fill="#f7efe8"/>
    <text class="f num" x="64" y="656.5" text-anchor="middle" fill="#cc9966">6</text>
    <text class="f title" x="86" y="657">Execute</text>
    <text class="m mod" x="540" y="656" text-anchor="end">runtime/ · wasmtime</text>
    <text class="f desc" x="86" y="676">Host binds vera.* imports (IO, State, Http, …) — vera run · test · serve</text>
  </g>

  <!-- alternate-target chips -->
  <g>
    <rect class="card" x="600" y="580" width="284" height="40" rx="10"/>
    <rect x="600.5" y="580.5" width="4" height="39" rx="2" fill="#cc9966"/>
    <text class="f t12" x="614" y="597">Browser bundle</text>
    <text class="m" x="614" y="611" font-size="9.5px" fill="#7a756d">browser/runtime.mjs · --target browser</text>
  </g>
  <g>
    <rect class="card" x="600" y="628" width="284" height="40" rx="10"/>
    <rect x="600.5" y="628.5" width="4" height="39" rx="2" fill="#cc9966"/>
    <text class="f t12" x="614" y="645">WASI 0.2 component</text>
    <text class="m" x="614" y="659" font-size="9.5px" fill="#7a756d">codegen/wasi.py · --target wasi-p2</text>
  </g>

  <!-- footer -->
  <text class="f foot" x="36" y="718">Cross-cutting: cli.py orchestrates every stage · errors.py (Diagnostic, E-codes) · formatter.py (vera fmt) · tester.py (vera test)</text>
  <text class="f footi" x="36" y="738">Nothing exits early — every stage accumulates diagnostics, so an agent gets all feedback in one pass.</text>
</svg>
