<svg width="920" height="872" viewBox="0 0 920 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Vera compiler architecture: parse, transform, resolve (every call bound to its declaration) and type check build one typed program, with every generic instance and every obligation site derived once; vera verify proves or defers each obligation and then compiles the program to check every runtime-check claim against the emitted module, vera compile emits WAT and WASM with contract guards whatever verify would say, and the module runs on wasmtime, in the browser or as a WASI 0.2 component; naming.py is the one renderer every later stage asks for slot names and State/Exn families</title>
  <!--
    Hand-authored. Design system (from the house app style):
      panel #faf9f7 / border #e8e6e1 / radius 14 · cards #fff radius 10, 4px left accent
      categories: frontend #4a82a8 · type-check #8b6cad · verify #d4952a · compile #5a9e6f · runtime #cc9966
      tints (15% over white): #e4ecf2 · #ede8f2 · #f8efdf · #e6f0e9 · #f7efe8
      text #2d2b28 / #7a756d / #a9a49b · system font stack, mono for file names
    Rules: no live counts (they drift); the check → {verify | compile} fork is deliberate —
    `vera compile` does not consume verify results; a contract's guard is emitted whether or not the contract was proved.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .h1 { font-size: 16.5px; font-weight: 600; fill: #2d2b28; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .dash { fill: #ffffff; stroke: #cfccc5; stroke-width: 1; stroke-dasharray: 4 3; }
      .title { font-size: 14px; font-weight: 600; fill: #2d2b28; }
      .t12 { font-size: 12px; font-weight: 600; fill: #2d2b28; }
      .mod { font-size: 10.5px; fill: #7a756d; }
      .desc { font-size: 11.5px; fill: #7a756d; }
      .num { font-size: 11px; font-weight: 700; }
      .art { font-size: 11px; font-style: italic; fill: #a9a49b; }
      .pill { fill: #f3f2ef; stroke: #e8e6e1; stroke-width: 1; }
      .pillt { font-size: 10px; fill: #7a756d; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .foot { font-size: 11px; fill: #7a756d; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="1.5" y="1.5" width="917" height="869" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <!-- header -->
  <text class="f micro" x="36" y="42">VERA COMPILER · vera/</text>
  <text class="f h1" x="36" y="66">Compilation pipeline &amp; module map</text>
  <text class="f sub" x="36" y="86">From source to WebAssembly, each stage is an independently testable module with one public entry point.</text>

  <!-- ═══ spine ═══ -->

  <!-- 1 · Parse -->
  <g>
    <rect class="card" x="36" y="108" width="520" height="58" rx="10"/>
    <rect x="36.5" y="108.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="120" width="24" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="64" y="134.5" text-anchor="middle" fill="#4a82a8">1</text>
    <text class="f title" x="86" y="135">Parse</text>
    <text class="m mod" x="540" y="134" text-anchor="end">grammar.lark · parser.py</text>
    <text class="f desc" x="86" y="154">Source text → Lark parse tree (LALR(1))</text>
  </g>
  <line class="edge" x1="64" y1="166" x2="64" y2="196" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="185">Lark parse tree</text>

  <!-- 2 · Transform -->
  <g>
    <rect class="card" x="36" y="198" width="520" height="58" rx="10"/>
    <rect x="36.5" y="198.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="210" width="24" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="64" y="224.5" text-anchor="middle" fill="#4a82a8">2</text>
    <text class="f title" x="86" y="225">Transform</text>
    <text class="m mod" x="540" y="224" text-anchor="end">transform.py · ast.py</text>
    <text class="f desc" x="86" y="244">Parse tree → typed AST</text>
  </g>
  <line class="edge" x1="64" y1="256" x2="64" y2="286" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="275">typed AST</text>

  <!-- 3 · Resolve -->
  <g>
    <rect class="card" x="36" y="288" width="520" height="58" rx="10"/>
    <rect x="36.5" y="288.5" width="4" height="57" rx="2" fill="#4a82a8"/>
    <rect x="52" y="300" width="24" height="20" rx="6" fill="#e4ecf2"/>
    <text class="f num" x="64" y="314.5" text-anchor="middle" fill="#4a82a8">3</text>
    <text class="f title" x="90" y="315">Resolve</text>
    <text class="m mod" x="540" y="314" text-anchor="end">resolver.py · binding.py</text>
    <text class="f desc" x="90" y="334">Module closure · cycle detection · each call bound to its declaration</text>
  </g>
  <line class="edge" x1="64" y1="346" x2="64" y2="376" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="365">AST + module closure</text>

  <!-- 4 · Type Check -->
  <g>
    <rect class="card" x="36" y="378" width="520" height="58" rx="10"/>
    <rect x="36.5" y="378.5" width="4" height="57" rx="2" fill="#8b6cad"/>
    <rect x="52" y="390" width="24" height="20" rx="6" fill="#ede8f2"/>
    <text class="f num" x="64" y="404.5" text-anchor="middle" fill="#8b6cad">4</text>
    <text class="f title" x="86" y="405">Type Check</text>
    <text class="m mod" x="540" y="404" text-anchor="end">checker/ · naming.py · environment.py · types.py</text>
    <text class="f desc" x="86" y="424">Register every signature, then check bodies → list[Diagnostic]</text>
  </g>

  <line class="edge" x1="64" y1="436" x2="64" y2="466" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="455">checked AST + the type of every node</text>

  <!-- 4b · Typed program -->
  <g>
    <rect class="card" x="36" y="468" width="520" height="58" rx="10"/>
    <rect x="36.5" y="468.5" width="4" height="57" rx="2" fill="#8b6cad"/>
    <rect x="47" y="480" width="34" height="20" rx="6" fill="#ede8f2"/>
    <text class="f num" x="64" y="494.5" text-anchor="middle" fill="#8b6cad">4b</text>
    <text class="f title" x="90" y="495">Typed program</text>
    <text class="m mod" x="540" y="494" text-anchor="end">typed.py · obligations/table.py</text>
    <text class="f desc" x="90" y="514">Instances and clones built once · obligation sites listed once</text>
  </g>

  <!-- fork: spine continues to Compile; branch goes right to Verify; both read the typed program -->
  <line class="edge" x1="64" y1="526" x2="64" y2="628" marker-end="url(#arr)"/>
  <rect class="pill" x="74" y="560" width="166" height="18" rx="9"/>
  <text class="m pillt" x="157" y="572.5" text-anchor="middle">vera compile · vera run</text>

  <polyline class="edge" points="500,526 500,540 590,540" marker-end="url(#arr)"/>
  <rect class="pill" x="498" y="548" width="90" height="18" rx="9"/>
  <text class="m pillt" x="543" y="560.5" text-anchor="middle">vera verify</text>

  <!-- 5 · Verify (report path, right column) -->
  <g>
    <rect class="card" x="600" y="488" width="284" height="116" rx="10"/>
    <rect x="600.5" y="488.5" width="4" height="115" rx="2" fill="#d4952a"/>
    <rect x="614" y="498" width="24" height="20" rx="6" fill="#f8efdf"/>
    <text class="f num" x="626" y="512.5" text-anchor="middle" fill="#d4952a">5</text>
    <text class="f title" x="648" y="513">Verify</text>
    <text class="m mod" x="870" y="512" text-anchor="end">verifier.py · smt.py</text>
    <text class="f desc" x="614" y="532">Z3 proves each obligation (Tier 1)</text>
    <text class="f desc" x="614" y="548">or defers it (Tier 3) then compiles</text>
    <text class="f desc" x="614" y="564">and matches each Tier 3 claim</text>
    <text class="m" x="614" y="580" font-size="10px" fill="#7a756d">reconcile.py · E541 / W004 on a mismatch</text>
    <text class="m" x="614" y="595" font-size="10px" fill="#b07820">→ ok · diagnostics · Tier 1 / Tier 3 counts</text>
  </g>

  <!-- warm-verification sidecar -->
  <line x1="742" y1="604" x2="742" y2="620" stroke="#cfccc5" stroke-width="1" stroke-dasharray="3 3"/>
  <g>
    <rect class="dash" x="600" y="620" width="284" height="58" rx="10"/>
    <text class="m t12" x="614" y="640" font-size="11px">obligations/ · lsp/</text>
    <text class="f" x="614" y="656" font-size="10.5px" fill="#7a756d">Reified proof obligations · warm VerificationSession</text>
    <text class="f" x="614" y="670" font-size="10.5px" fill="#7a756d">re-proves edits for the proof-delta LSP methods</text>
  </g>

  <!-- 6 · Compile -->
  <g>
    <rect class="card" x="36" y="630" width="520" height="58" rx="10"/>
    <rect x="36.5" y="630.5" width="4" height="57" rx="2" fill="#5a9e6f"/>
    <rect x="52" y="642" width="24" height="20" rx="6" fill="#e6f0e9"/>
    <text class="f num" x="64" y="656.5" text-anchor="middle" fill="#5a9e6f">6</text>
    <text class="f title" x="86" y="657">Compile</text>
    <text class="m mod" x="540" y="656" text-anchor="end">codegen/ · wasm/</text>
    <text class="f desc" x="86" y="676">Emit the typed program's clones · insert contract guards · WAT → wat2wasm</text>
  </g>
  <line class="edge" x1="64" y1="688" x2="64" y2="718" marker-end="url(#arr)"/>
  <text class="f art" x="78" y="707">WAT + .wasm</text>

  <!-- Compile → alternate targets -->
  <polyline class="edge" points="556,659 578,659 578,706 590,706" marker-end="url(#arr)"/>
  <polyline class="edge" points="578,706 578,754 590,754" marker-end="url(#arr)"/>

  <!-- 7 · Execute -->
  <g>
    <rect class="card" x="36" y="720" width="520" height="58" rx="10"/>
    <rect x="36.5" y="720.5" width="4" height="57" rx="2" fill="#cc9966"/>
    <rect x="52" y="732" width="24" height="20" rx="6" fill="#f7efe8"/>
    <text class="f num" x="64" y="746.5" text-anchor="middle" fill="#cc9966">7</text>
    <text class="f title" x="86" y="747">Execute</text>
    <text class="m mod" x="540" y="746" text-anchor="end">runtime/ · wasmtime</text>
    <text class="f desc" x="86" y="766">Host binds the vera.* imports (IO, State, Http, …) · vera run · test · serve</text>
  </g>

  <!-- alternate-target chips -->
  <g>
    <rect class="card" x="600" y="686" width="284" height="40" rx="10"/>
    <rect x="600.5" y="686.5" width="4" height="39" rx="2" fill="#cc9966"/>
    <text class="f t12" x="614" y="703">Browser bundle</text>
    <text class="m" x="614" y="717" font-size="9.5px" fill="#7a756d">browser/runtime.mjs · --target browser</text>
  </g>
  <g>
    <rect class="card" x="600" y="734" width="284" height="40" rx="10"/>
    <rect x="600.5" y="734.5" width="4" height="39" rx="2" fill="#cc9966"/>
    <text class="f t12" x="614" y="751">WASI 0.2 component</text>
    <text class="m" x="614" y="765" font-size="9.5px" fill="#7a756d">codegen/wasi.py · --target wasi-p2</text>
  </g>

  <!-- footer -->
  <text class="f foot" x="36" y="808">Cross-cutting: cli.py orchestrates every stage · errors.py (Diagnostic, E and W codes) · formatter.py (vera fmt) · tester.py (vera test)</text>
  <text class="f foot" x="36" y="828">naming.py answers “what is this type expression called?” once; stages 5 and 6, tester.py and lsp/ render slot names and State/Exn families through it.</text>
  <text class="f footi" x="36" y="850">Within a stage nothing exits early: the checker and the verifier accumulate every diagnostic, so an agent gets them all in one pass.</text>
</svg>
