<svg width="920" height="336" viewBox="0 0 920 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">The CLI mirrors the pipeline: vera parse and fmt stop at parsing, check and ast at type checking, verify at contract verification, compile and test at code generation, run and serve at execution — and vera lsp keeps the whole pipeline warm at editor latency.</title>
  <!-- Design system: see architecture.svg. Grounded in TOOLCHAIN.md. -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .t { font-size: 13px; font-weight: 600; fill: #2d2b28; }
      .pill { fill: #f3f2ef; stroke: #e8e6e1; stroke-width: 1; }
      .pt { font-size: 10.5px; fill: #2d2b28; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .drop { stroke: #d9d6d0; stroke-width: 1; stroke-dasharray: 3 3; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="333" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="42">TOOLCHAIN · THE CLI MIRRORS THE PIPELINE</text>
  <text class="f sub" x="36" y="64">Every command stops at its stage; everything before it must already hold.</text>

  <!-- stage strip -->
  <g>
    <rect class="card" x="36" y="88" width="140" height="38" rx="10"/>
    <rect x="36.5" y="88.5" width="4" height="37" rx="2" fill="#4a82a8"/>
    <text class="f t" x="106" y="112" text-anchor="middle">parse</text>
  </g>
  <line class="edge" x1="176" y1="107" x2="204" y2="107" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="208" y="88" width="140" height="38" rx="10"/>
    <rect x="208.5" y="88.5" width="4" height="37" rx="2" fill="#8b6cad"/>
    <text class="f t" x="278" y="112" text-anchor="middle">check</text>
  </g>
  <line class="edge" x1="348" y1="107" x2="376" y2="107" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="380" y="88" width="140" height="38" rx="10"/>
    <rect x="380.5" y="88.5" width="4" height="37" rx="2" fill="#d4952a"/>
    <text class="f t" x="450" y="112" text-anchor="middle">verify</text>
  </g>
  <line class="edge" x1="520" y1="107" x2="548" y2="107" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="552" y="88" width="140" height="38" rx="10"/>
    <rect x="552.5" y="88.5" width="4" height="37" rx="2" fill="#5a9e6f"/>
    <text class="f t" x="622" y="112" text-anchor="middle">compile</text>
  </g>
  <line class="edge" x1="692" y1="107" x2="720" y2="107" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="724" y="88" width="140" height="38" rx="10"/>
    <rect x="724.5" y="88.5" width="4" height="37" rx="2" fill="#cc9966"/>
    <text class="f t" x="794" y="112" text-anchor="middle">run</text>
  </g>

  <!-- command pills -->
  <line class="drop" x1="106" y1="126" x2="106" y2="146"/>
  <rect class="pill" x="36" y="148" width="140" height="26" rx="13"/>
  <text class="m pt" x="106" y="165" text-anchor="middle">vera parse</text>
  <rect class="pill" x="36" y="182" width="140" height="26" rx="13"/>
  <text class="m pt" x="106" y="199" text-anchor="middle">vera fmt</text>

  <line class="drop" x1="278" y1="126" x2="278" y2="146"/>
  <rect class="pill" x="208" y="148" width="140" height="26" rx="13"/>
  <text class="m pt" x="278" y="165" text-anchor="middle">vera check</text>
  <rect class="pill" x="208" y="182" width="140" height="26" rx="13"/>
  <text class="m pt" x="278" y="199" text-anchor="middle">vera ast</text>

  <line class="drop" x1="450" y1="126" x2="450" y2="146"/>
  <rect class="pill" x="380" y="148" width="140" height="26" rx="13"/>
  <text class="m pt" x="450" y="165" text-anchor="middle">vera verify</text>

  <line class="drop" x1="622" y1="126" x2="622" y2="146"/>
  <rect class="pill" x="552" y="148" width="140" height="26" rx="13"/>
  <text class="m pt" x="622" y="165" text-anchor="middle">vera compile</text>
  <rect class="pill" x="552" y="182" width="140" height="26" rx="13"/>
  <text class="m pt" x="622" y="199" text-anchor="middle">vera test</text>

  <line class="drop" x1="794" y1="126" x2="794" y2="146"/>
  <rect class="pill" x="724" y="148" width="140" height="26" rx="13"/>
  <text class="m pt" x="794" y="165" text-anchor="middle">vera run</text>
  <rect class="pill" x="724" y="182" width="140" height="26" rx="13"/>
  <text class="m pt" x="794" y="199" text-anchor="middle">vera serve</text>

  <!-- cross-stage tools -->
  <rect class="pill" x="36" y="240" width="430" height="28" rx="14"/>
  <text class="m pt" x="251" y="258" text-anchor="middle">vera lsp — the whole pipeline, warm, at editor latency</text>
  <rect class="pill" x="480" y="240" width="404" height="28" rx="14"/>
  <text class="m pt" x="682" y="258" text-anchor="middle">vera builtins · effects · errors — registries, no file needed</text>

  <!-- footer -->
  <text class="f footi" x="36" y="304">Every command takes --json for machine-readable output; --quiet suppresses success chatter.</text>
</svg>
