<svg width="920" height="560" viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Three-tier contract verification: each obligation goes to Z3 with a ten-second default budget. Unsat is verified (Tier 1) and sat is a vera verify error with a counterexample; unknown or timeout becomes a Tier 3 runtime check, compiled into the module where the obligation arises, or, where no check can be emitted, a disclosed warning (E504, E506, E539, E540, E542, E543) or the E538 error, counted in no tier. Tier 2, where hints from assert axioms and lemmas would extend the solver to quantifiers, calls and arrays, is specified but not implemented.</title>
  <!-- Design system: see architecture.svg. Truthfulness: Tier 3 contracts are compiled
       as runtime guards; this diagram makes no claim about Tier 1 guard omission (#958). -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#a9a49b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .f  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      .m  { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 1.5px; fill: #a9a49b; }
      .sub { font-size: 11.5px; fill: #7a756d; }
      .card { fill: #ffffff; stroke: #e8e6e1; stroke-width: 1; }
      .title { font-size: 13.5px; font-weight: 600; fill: #2d2b28; }
      .desc { font-size: 11px; fill: #7a756d; }
      .edge { fill: none; stroke: #a9a49b; stroke-width: 1.5; }
      .lbl { font-size: 10.5px; font-weight: 600; }
      .footi { font-size: 11px; font-style: italic; fill: #a9a49b; }
    </style>
  </defs>

  <rect x="1.5" y="1.5" width="917" height="557" rx="14" fill="#faf9f7" stroke="#e8e6e1" stroke-width="1.5"/>

  <text class="f micro" x="36" y="42">CONTRACT VERIFICATION · THREE TIERS</text>
  <text class="f sub" x="36" y="64">Every obligation (requires, ensures, decreases, refinement, primitive-op safety) is proved, checked at run time, or disclosed.</text>

  <!-- obligation source -->
  <g>
    <rect class="card" x="270" y="88" width="380" height="46" rx="10"/>
    <rect x="270.5" y="88.5" width="4" height="45" rx="2" fill="#8b6cad"/>
    <text class="f title" x="460" y="108" text-anchor="middle">Contract obligation</text>
    <text class="f desc" x="460" y="124" text-anchor="middle">requires · ensures · decreases · refinements · underflow / div-zero / bounds</text>
  </g>
  <line class="edge" x1="460" y1="134" x2="460" y2="162" marker-end="url(#arr)"/>

  <!-- Tier 1 solver card -->
  <g>
    <rect class="card" x="250" y="164" width="420" height="64" rx="10"/>
    <rect x="250.5" y="164.5" width="4" height="63" rx="2" fill="#d4952a"/>
    <text class="f title" x="460" y="188" text-anchor="middle">Tier 1: Z3, decidable fragment</text>
    <text class="f desc" x="460" y="206" text-anchor="middle">quantifier-free linear arithmetic · booleans · strings · ADTs</text>
    <text class="m" x="460" y="220" text-anchor="middle" font-size="10px" fill="#b07820">10-second default budget per obligation (--timeout-ms)</text>
  </g>

  <!-- Tier 2: Z3 guided by hints -->
  <g>
    <rect x="706" y="164" width="178" height="64" rx="10" fill="#ffffff" stroke="#cfccc5" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="f" x="720" y="184" font-size="12px" font-weight="600" fill="#7a756d">Tier 2: Z3 guided</text>
    <text class="f desc" x="720" y="199">assert axioms · lemmas for</text>
    <text class="f desc" x="720" y="212">quantifiers · calls · arrays</text>
    <text class="f desc" x="720" y="224" font-style="italic" fill="#a9a49b">not implemented (#427)</text>
  </g>

  <!-- three outcomes -->
  <polyline class="edge" points="330,228 330,268 190,268 190,296" marker-end="url(#arr)"/>
  <text class="m lbl" x="310" y="262" text-anchor="end" fill="#5a9e6f">unsat</text>

  <line class="edge" x1="460" y1="228" x2="460" y2="296" marker-end="url(#arr)"/>
  <text class="m lbl" x="472" y="286" fill="#c45">sat · counterexample</text>

  <polyline class="edge" points="590,228 590,268 676,268 676,296" marker-end="url(#arr)"/>
  <text class="m lbl" x="600" y="262" fill="#b07820">unknown · timeout</text>

  <!-- outcome: verified -->
  <g>
    <rect class="card" x="60" y="298" width="260" height="78" rx="10"/>
    <rect x="60.5" y="298.5" width="4" height="77" rx="2" fill="#5a9e6f"/>
    <text class="f title" x="76" y="322" fill="#3d7a4d">Verified: Tier 1</text>
    <text class="f desc" x="76" y="340">Proved for all inputs, so this</text>
    <text class="f desc" x="76" y="354">obligation cannot fail at run time.</text>
    <text class="m" x="76" y="369" font-size="10px" fill="#7a756d">reported: N verified (Tier 1)</text>
  </g>

  <!-- outcome: violated -->
  <g>
    <rect class="card" x="336" y="298" width="248" height="78" rx="10"/>
    <rect x="336.5" y="298.5" width="4" height="77" rx="2" fill="#c45"/>
    <text class="f title" x="352" y="322" fill="#a83838">Violated: vera verify error</text>
    <text class="f desc" x="352" y="340">Z3 found inputs that break the</text>
    <text class="f desc" x="352" y="354">contract; the counterexample is</text>
    <text class="f desc" x="352" y="368">reported in the diagnostic (E500…)</text>
  </g>

  <!-- outcome: tier 3 -->
  <g>
    <rect class="card" x="600" y="298" width="284" height="78" rx="10"/>
    <rect x="600.5" y="298.5" width="4" height="77" rx="2" fill="#d4952a"/>
    <text class="f title" x="616" y="322" fill="#b07820">Tier 3: runtime check</text>
    <text class="f desc" x="616" y="340">The obligation is compiled into the module</text>
    <text class="f desc" x="616" y="354">as a check where it arises: on entry, on</text>
    <text class="f desc" x="616" y="368">return, at a call site or at an operation.</text>
  </g>

  <!-- tier-3 runtime trap -->
  <line class="edge" x1="742" y1="376" x2="742" y2="404" marker-end="url(#arr)"/>
  <g>
    <rect class="card" x="600" y="406" width="284" height="62" rx="10"/>
    <rect x="600.5" y="406.5" width="4" height="61" rx="2" fill="#cc9966"/>
    <text class="f title" x="616" y="428">Violation at run time → trap</text>
    <text class="f desc" x="616" y="446">E800 names the failed contract · trap_kind</text>
    <text class="f desc" x="616" y="460">(contract_violation, …) in --json · source backtrace</text>
  </g>

  <!-- unknown, and no check can be emitted: disclosed -->
  <polyline class="edge" points="620,376 620,392 460,392 460,404" marker-end="url(#arr)" stroke-dasharray="4 3"/>
  <text class="f desc" x="472" y="388" font-style="italic">no check can be emitted</text>
  <g>
    <rect class="card" x="336" y="406" width="248" height="62" rx="10"/>
    <rect x="336.5" y="406.5" width="4" height="61" rx="2" fill="#a9a49b"/>
    <text class="f title" x="352" y="428">Disclosed, not checked</text>
    <text class="f desc" x="352" y="446">warning E504 · E506 · E539 · E540 · E542</text>
    <text class="f desc" x="352" y="460">· E543, or the E538 error; in no tier</text>
  </g>

  <!-- footer -->
  <text class="f footi" x="36" y="500">A fully Tier-1 program has the strongest guarantee:</text>
  <text class="f footi" x="36" y="516">if vera verify passes, its contracts hold for every input.</text>
  <text class="m" x="36" y="540" font-size="10px" fill="#7a756d">vera verify → “Verification: 12 verified (Tier 1), 2 runtime checks (Tier 3)”</text>
</svg>
